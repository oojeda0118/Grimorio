["escorpio","Escorpio","♏","23 de octubre al 21 de noviembre","El escorpión (y el águila)","agua","fija","femenina","Plutón (moderno) y Marte (tradicional)","Tauro","Los órganos sexuales y de eliminación","La Muerte (XIII)","Una M con un aguijón.",
 "Escorpio es intensidad, profundidad, pasión y transformación. No le interesa la superficie: quiere la verdad. Es leal y magnético. Su reto son los celos, el control y el rencor."],
["sagitario","Sagitario","♐","22 de noviembre al 21 de diciembre","El centauro arquero","fuego","mutable","masculina","Júpiter","Géminis","Las caderas y los muslos","La Templanza (XIV)","Una flecha que apunta hacia arriba.",
 "Sagitario es optimismo, aventura, búsqueda de sentido y amor por la libertad. Le gustan los viajes, la filosofía y la verdad dicha sin rodeos. Su reto es la exageración y la falta de tacto."],
["capricornio","Capricornio","♑","22 de diciembre al 19 de enero","La cabra con cola de pez","tierra","cardinal","femenina","Saturno","Cáncer","Las rodillas, los huesos y la piel","El Diablo (XV)","La cabra-pez: un cuerno y una cola enroscada.",
 "Capricornio es ambición, disciplina, responsabilidad y paciencia. Construye a largo plazo y respeta el esfuerzo. Su reto es la rigidez, la frialdad y cargar con demasiado."],
["acuario","Acuario","♒","20 de enero al 18 de febrero","El aguador","aire","fija","masculina","Urano (moderno) y Saturno (tradicional)","Leo","Los tobillos y la circulación","La Estrella (XVII)","Dos ondas: el agua que se vierte o la energía que circula.",
 "Acuario es originalidad, independencia, amistad y visión de futuro. Piensa en el grupo y en la humanidad, y defiende su libertad. Su reto es el distanciamiento emocional. Aunque se llama aguador, es un signo de aire."],
["piscis","Piscis","♓","19 de febrero al 20 de marzo","Dos peces unidos","agua","mutable","femenina","Neptuno (moderno) y Júpiter (tradicional)","Virgo","Los pies","La Luna (XVIII)","Dos peces que nadan en direcciones opuestas, unidos por un lazo.",
 "Piscis es compasión, imaginación, intuición y espiritualidad. Siente lo que sienten los demás y se conecta con lo invisible. Su reto es la confusión, la evasión y la falta de límites."]
].forEach(([id,t,g,dates,sym,el,mod,pol,ruler,opp,body,card,glyph,txt])=>G("sg-"+id,"signos",t,g,txt.split(". ")[0]+".",
 [txt,`Es un signo de ${el}, ${mod} y de polaridad ${pol}. Su regente es ${ruler} y su signo opuesto es ${opp}.`],
 [["Fechas aproximadas",dates],["Símbolo",sym],["Glifo",glyph],["Elemento",cap(el)],["Modalidad",cap(mod)],["Polaridad",cap(pol)],["Regente",ruler],["Opuesto",opp],["Parte del cuerpo",body],["En el tarot",card]],
 ["elementos","modalidades","polaridad","rige"]));

/* ---- Aspectos ---- */
[
["conjuncion","Conjunción","☌","0°","Dos planetas en el mismo lugar: sus energías se funden.",
 "Dos planetas están en conjunción cuando ocupan casi el mismo grado del zodiaco. Sus energías se mezclan y actúan juntas, para bien o para mal según los planetas implicados. Es el aspecto más potente. Varias conjunciones juntas forman un stellium.","Orbe habitual: 8° a 10°."],
["oposicion","Oposición","☍","180°","Planetas enfrentados que buscan equilibrio.",
 "Dos planetas en signos opuestos, a 180°. Generan tensión y polaridad, como un tira y afloja. A menudo una de las energías se proyecta en otras personas, por eso este aspecto se vive mucho en las relaciones. El reto es integrar ambos lados.","Orbe habitual: 8°."],
["trigono","Trígono","△","120°","Armonía y talento natural.",
 "Dos planetas separados por 120°, normalmente en signos del mismo elemento. Su energía fluye sin esfuerzo: indica dones y facilidades. Como todo es tan fácil, a veces no se aprovecha conscientemente.","Orbe habitual: 6° a 8°."],
["cuadratura","Cuadratura","□","90°","Tensión que empuja a actuar.",
 "Dos planetas a 90°, normalmente en signos de la misma modalidad pero de elementos incompatibles. Crea fricción, obstáculos y crisis, pero también motivación: es el aspecto que más hace crecer porque obliga a moverse.","Orbe habitual: 6° a 8°."],
["sextil","Sextil","⚹","60°","Oportunidad que se aprovecha con iniciativa.",
 "Dos planetas a 60°, normalmente en signos de elementos compatibles (fuego con aire, tierra con agua). Es armónico como el trígono, pero más suave: abre puertas que hay que decidir cruzar.","Orbe habitual: 4° a 6°."],
["quincuncio","Quincuncio o inconjunción","⚻","150°","Dos energías que no se entienden y piden ajustes.",
 "Dos planetas a 150°, en signos que no comparten ni elemento, ni modalidad, ni polaridad. Produce incomodidad y la sensación de tener que ajustar constantemente. Es un aspecto menor pero muy notorio cuando es exacto.","Orbe habitual: 2° a 3°."],
["semisextil","Semisextil","⚺","30°","Un roce leve entre signos vecinos.",
 "Dos planetas a 30°, en signos contiguos. Es un aspecto menor de ajuste y aprendizaje, sutil.","Orbe habitual: 2°."],
["semicuadratura","Semicuadratura","∠","45°","Una pequeña tensión irritante.",
 "La mitad de una cuadratura: una fricción menor que se nota como irritación o inquietud.","Orbe habitual: 2°."],
["sesquicuadratura","Sesquicuadratura","⚼","135°","Tensión menor que busca salida.",
 "Una cuadratura y media. Como la semicuadratura, es un aspecto menor de tensión que suele expresarse de forma repentina.","Orbe habitual: 2°."],
["quintil","Quintil","Q","72°","Talento creativo especial.",
 "Una quinta parte del círculo. Los astrólogos que lo usan lo asocian a talentos creativos o habilidades muy personales.","Orbe habitual: 1° a 2°."]
].forEach(([id,t,g,deg,s,txt,orb])=>G("as-"+id,"aspectos",t,g,s,[txt,"Los aspectos son ángulos que forman los planetas entre sí, medidos en grados sobre el círculo del zodiaco. Esta app calcula los cinco aspectos mayores: conjunción, sextil, cuadratura, trígono y oposición."],[["Ángulo",deg],["Orbe",orb.replace("Orbe habitual: ","")]],["aspecto","orbe","aplicativo"]));

/* ---- La carta natal ---- */
G("carta-natal","carta","Carta natal","","Un mapa del cielo en el momento exacto en que naciste.",
 ["La carta natal, también llamada carta astral u horóscopo natal, es un dibujo del cielo visto desde el lugar donde naciste, en el minuto en que naciste. Muestra en qué signo y en qué casa estaba cada planeta y qué ángulos formaban entre sí.","Para calcularla hacen falta tres datos: fecha, hora y lugar. Con la fecha basta para el Sol y casi todos los planetas; la hora y el lugar son imprescindibles para el Ascendente y las casas, que cambian cada pocos minutos.","Se lee combinando tres capas: los planetas (qué energía), los signos (cómo se expresa) y las casas (en qué área de la vida)."],[],["ascendente","casas","aspecto"]);
G("grados","carta","Grados y minutos","°′","Cómo se mide la posición exacta de un planeta.",
 ["El zodiaco es un círculo de 360 grados dividido en 12 signos de 30 grados cada uno. Por eso una posición se escribe como un número del 0 al 29 seguido del signo: “15° Leo” significa que el planeta está a mitad de Leo.","Cada grado se divide en 60 minutos de arco (′). “23°15′ Cáncer” es un poco más de 23 grados dentro de Cáncer. La Luna avanza unos 13 grados por día; el Sol, casi uno.","El grado 0 de un signo marca un comienzo puro de su energía. El grado 29, llamado “anarético” o crítico, se interpreta como un final, una urgencia o un tema que hay que completar antes de pasar al siguiente signo."],[],["carta-natal","decanato"]);
G("ascendente","carta","Ascendente","AC","El signo que salía por el horizonte este cuando naciste.",
 ["El Ascendente es el grado del zodiaco que estaba saliendo por el horizonte oriental en el momento de tu nacimiento. Marca el inicio de la casa 1 y es uno de los puntos más personales de la carta, porque cambia de signo cada dos horas aproximadamente.","Representa cómo te presentas, la primera impresión que das, tu forma de empezar las cosas y, a veces, tu aspecto físico. Es como la puerta de entrada a tu carta.","Junto con el Sol y la Luna forma los “tres pilares” de la personalidad. Si no sabes tu hora de nacimiento, no se puede calcular."],[["Abreviatura","AC o ASC"]],["descendente","casas","pl-sol"]);
G("descendente","carta","Descendente","DC","El punto opuesto al Ascendente: las relaciones.",
 ["El Descendente está exactamente enfrente del Ascendente, en el horizonte occidental, y marca el inicio de la casa 7.","Representa lo que buscas en los demás, tu forma de relacionarte en pareja y en sociedades, y a menudo las cualidades que proyectas en otras personas porque no las reconoces en ti."],[["Abreviatura","DC o DSC"]],["ascendente","casas"]);
G("mediocielo","carta","Medio cielo","MC","El punto más alto: vocación e imagen pública.",
 ["El Medio cielo (del latín Medium Coeli) es el punto del zodiaco que estaba en lo más alto del cielo cuando naciste. Marca el inicio de la casa 10 en la mayoría de los sistemas.","Representa tu vocación, tus metas a largo plazo, tu carrera y cómo te ve el mundo en tu papel público."],[["Abreviatura","MC"]],["fondocielo","casas"]);
G("fondocielo","carta","Fondo del cielo","IC","El punto más bajo: raíces y hogar.",
 ["El Fondo del cielo (Imum Coeli) es el punto opuesto al Medio cielo, bajo tus pies en el momento de nacer. Marca el inicio de la casa 4.","Representa tus raíces, tu familia de origen, tu hogar, tu vida privada y tu sentido de pertenencia."],[["Abreviatura","IC"]],["mediocielo","casas"]);
G("angulos","carta","Ángulos de la carta","","Los cuatro puntos cardinales de la carta.",
 ["El Ascendente, el Fondo del cielo, el Descendente y el Medio cielo son los cuatro ángulos. Dividen la carta en cuatro cuadrantes y marcan las cúspides de las casas 1, 4, 7 y 10, llamadas casas angulares.","Los planetas que están muy cerca de un ángulo se consideran especialmente fuertes y visibles en la vida de la persona. En la rueda de esta app, los ejes se dibujan con una línea dorada más gruesa."],[],["ascendente","mediocielo"]);
G("casas","carta","Casas","1–12","Las doce áreas de la vida.",
 ["Las casas dividen la carta en doce sectores, cada uno asociado a un área de la vida. Mientras los signos dependen de la fecha, las casas dependen de la hora y el lugar.","1: tu persona y tu presencia. 2: dinero, recursos y autoestima. 3: comunicación, hermanos, entorno cercano y estudios básicos. 4: hogar, familia y raíces. 5: creatividad, romance, juego e hijos. 6: trabajo diario, salud y rutinas. 7: pareja y socios. 8: intimidad, crisis, herencias y lo compartido. 9: viajes, estudios superiores y filosofía. 10: vocación y vida pública. 11: amistades, grupos y proyectos. 12: el inconsciente, el retiro y lo espiritual.","Las casas 1, 4, 7 y 10 son angulares (las más fuertes); 2, 5, 8 y 11 son sucedentes; 3, 6, 9 y 12 son cadentes. Una casa vacía no significa que esa área no importe: se lee a través del signo en su cúspide y de su regente."],[],["cuspide","sistemas-casas","angulos"]);
G("cuspide","carta","Cúspide","","El inicio de una casa.",
 ["La cúspide es el grado exacto donde empieza una casa. El signo que está en la cúspide da el tono a esa área de la vida: por ejemplo, Libra en la cúspide de la casa 2 sugiere una relación con el dinero ligada a la armonía y la estética.","La cúspide de la casa 1 es el Ascendente y, en el sistema Placidus, la de la casa 10 es el Medio cielo."],[],["casas","sistemas-casas"]);
G("sistemas-casas","carta","Sistemas de casas","","Diferentes formas de dividir la carta.",
 ["No hay una única forma de calcular las casas. Placidus, el más usado en la astrología moderna, divide el tiempo que tarda cada grado en ir del horizonte al Medio cielo. Funciona mal cerca de los polos, pero sin problema en Venezuela.","Signos enteros es el sistema más antiguo, usado en la astrología helenística: cada casa ocupa un signo completo, empezando por el signo del Ascendente. Casas iguales divide la carta en doce partes de 30 grados desde el Ascendente.","Esta app te deja elegir entre los tres. Si un planeta cambia de casa al cambiar de sistema, suele estar cerca de una cúspide y se puede leer en ambas."],[],["casas","cuspide"]);
G("rige","carta","Regente","","El planeta que gobierna un signo o una casa.",
 ["Cada signo tiene un planeta regente: Marte rige Aries, Venus rige Tauro, etc. El regente de una casa es el planeta que rige el signo de su cúspide, y muestra a dónde se “va” la energía de esa casa.","El regente de la carta es el planeta que rige el signo del Ascendente, y se considera especialmente importante en la vida de la persona.","La astrología tradicional usa solo los siete planetas visibles; la moderna añadió Urano para Acuario, Neptuno para Piscis y Plutón para Escorpio."],[],["domicilio","casas"]);
G("domicilio","carta","Dignidades: domicilio, exaltación, exilio y caída","","Cómo de cómodo está un planeta en un signo.",
 ["Las dignidades esenciales miden la fuerza de un planeta según el signo donde está. En domicilio, el planeta está en el signo que rige y se expresa con naturalidad, como en su casa. En exaltación, está en un signo donde se le honra y su energía brilla especialmente.","En exilio (o detrimento) está en el signo opuesto a su domicilio, y en caída en el signo opuesto a su exaltación: allí su energía funciona de forma menos natural y pide más conciencia.","Un planeta en exilio o caída no es “malo”: simplemente se expresa de manera menos convencional."],[],["rige"]);
G("stellium","carta","Stellium","","Tres o más planetas juntos.",
 ["Un stellium es una concentración de tres o más planetas en un mismo signo o en una misma casa. Esa zona de la carta se vuelve protagonista: allí se concentra mucha energía y muchos temas de vida.","Por ejemplo, un stellium en la casa 10 suele indicar una vida muy volcada a la carrera."],[],["as-conjuncion"]);
G("interceptado","carta","Signo interceptado","","Un signo que queda dentro de una casa sin tocar ninguna cúspide.",
 ["En sistemas como Placidus, las casas no miden lo mismo. A veces un signo completo queda dentro de una casa grande sin estar en ninguna cúspide: se dice que está interceptado, y su signo opuesto también lo está.","Se interpreta como una energía que cuesta más expresar y que se desarrolla con el tiempo. En signos enteros o casas iguales no hay intercepciones."],[],["sistemas-casas"]);
G("elementos","carta","Elementos","","Fuego, tierra, aire y agua.",
 ["Los doce signos se reparten en cuatro elementos, tres signos cada uno. Fuego (Aries, Leo, Sagitario): energía, entusiasmo, acción. Tierra (Tauro, Virgo, Capricornio): lo práctico, lo concreto, lo estable. Aire (Géminis, Libra, Acuario): ideas, comunicación, relaciones. Agua (Cáncer, Escorpio, Piscis): emoción, intuición, sensibilidad.","El equilibrio de elementos en una carta muestra qué te sale natural y qué te falta. Los mismos cuatro elementos ordenan los palos del tarot: bastos son fuego, copas agua, espadas aire y oros tierra."],[],["modalidades","dignidades-elementales"]);
G("modalidades","carta","Modalidades","","Cardinal, fija y mutable.",
 ["Las modalidades, o cualidades, describen cómo actúa un signo. Los cardinales (Aries, Cáncer, Libra, Capricornio) inician: con ellos comienza cada estación. Los fijos (Tauro, Leo, Escorpio, Acuario) sostienen y consolidan: caen en mitad de la estación. Los mutables (Géminis, Virgo, Sagitario, Piscis) adaptan y transforman: cierran la estación y preparan el cambio.","Los signos de la misma modalidad forman cuadraturas y oposiciones entre sí."],[],["elementos","polaridad"]);
G("polaridad","carta","Polaridad","","Signos masculinos y femeninos, o activos y receptivos.",
 ["Los signos alternan entre dos polaridades. Los de fuego y aire se llaman masculinos, activos o yang: se expresan hacia afuera. Los de tierra y agua, femeninos, receptivos o yin: se orientan hacia adentro.","Los términos son tradicionales y no hablan del género de la persona, sino de una cualidad de la energía."],[],["elementos"]);
G("decanato","carta","Decanato","","Cada signo dividido en tres partes de 10 grados.",
 ["Cada signo se divide en tres decanatos de 10 grados. Cada uno tiene un planeta regente secundario que matiza la energía del signo: no es lo mismo el Sol a 3° de Leo que a 27° de Leo.","Esta división viene de la astronomía egipcia, que usaba 36 estrellas para medir las horas de la noche. En el tarot de la Golden Dawn, cada decanato corresponde a una carta menor del 2 al 10: por ejemplo, el primer decanato de Aries, regido por Marte, es el Dos de Bastos.","En esta app puedes ver el decanato de cada carta menor en su ficha, y el de tu Sol en tu carta natal."],[],["grados","decanos-tarot"]);
G("aspecto","carta","Aspecto","","El ángulo entre dos planetas.",
 ["Un aspecto es la distancia angular entre dos planetas o puntos de la carta, medida en grados. Ciertos ángulos se consideran significativos porque dividen el círculo en partes armónicas: 0°, 60°, 90°, 120° y 180° son los aspectos mayores.","Los aspectos muestran cómo dialogan las energías de tu carta: si se apoyan, se tensan o se funden. Una carta sin aspectos entre dos planetas indica que esas partes de ti funcionan por separado."],[],["orbe","as-conjuncion","as-trigono","as-cuadratura"]);
G("orbe","carta","Orbe","","El margen de tolerancia de un aspecto.",
 ["Los planetas rara vez forman ángulos exactos, así que se acepta un margen, llamado orbe. Si dos planetas están a 94°, forman una cuadratura con un orbe de 4°.","Cuanto más pequeño el orbe, más intenso se siente el aspecto. Los orbes suelen ser más amplios para el Sol y la Luna. En esta app, la carta natal usa unos 7-8° para los aspectos fuertes, la sinastría orbes más estrechos y los tránsitos solo 1-2°."],[],["aspecto","aplicativo"]);
G("aplicativo","carta","Aspecto aplicativo y separativo","","Si un aspecto se está formando o deshaciendo.",
 ["Un aspecto es aplicativo cuando el planeta más rápido se está acercando al ángulo exacto, y separativo cuando ya lo pasó y se aleja.","Se dice que los aplicativos son más fuertes y apuntan a lo que viene, mientras que los separativos hablan de algo que ya se está resolviendo. Es muy usado en tránsitos y en astrología horaria."],[],["orbe","transito"]);

/* ---- El cielo en movimiento ---- */
G("ecliptica","cielo","Eclíptica","","El camino aparente del Sol por el cielo.",
 ["Vista desde la Tierra, el Sol parece recorrer una franja del cielo a lo largo del año: esa línea es la eclíptica. Los planetas y la Luna se mueven siempre cerca de ella.","El zodiaco es esa franja dividida en doce sectores de 30 grados. Las longitudes que ves en la app, como “15° Leo”, se miden a lo largo de la eclíptica."],[],["zodiaco","nodos"]);
G("zodiaco","cielo","Zodiaco tropical y sidéreo","","Dos formas de medir los signos.",
 ["El zodiaco tropical, el más usado en Occidente y el que usa esta app, empieza Aries en el equinoccio de marzo: está atado a las estaciones del año.","El zodiaco sidéreo, usado en la astrología védica de la India, se mide respecto a las estrellas fijas. Por la precesión de los equinoccios, hoy ambos están desfasados unos 24 grados, así que en el sidéreo la mayoría de la gente “cambia” al signo anterior.","Las constelaciones que dan nombre a los signos tampoco coinciden ya con ellos: los signos son sectores iguales de 30 grados, mientras que las constelaciones tienen tamaños distintos."],[],["precesion","ecliptica"]);
G("precesion","cielo","Precesión de los equinoccios","","El lento giro del eje de la Tierra.",
 ["El eje de la Tierra tambalea como una peonza y completa un círculo en unos 26.000 años. Por eso el punto donde el Sol está en el equinoccio de marzo retrocede lentamente respecto a las estrellas, aproximadamente un grado cada 72 años.","De ahí viene la idea de las “eras astrológicas”, como la famosa Era de Acuario. El motor astronómico de esta app incluye esta corrección para dar posiciones tropicales exactas."],[],["zodiaco"]);
G("efemerides","cielo","Efemérides","","Tablas con la posición de los astros día a día.",
 ["Las efemérides son tablas que indican dónde está cada planeta en cada fecha. Antes los astrólogos calculaban las cartas a mano con ellas; hoy los programas las calculan con fórmulas astronómicas.","Esta app las calcula dentro del teléfono con los elementos orbitales publicados por el JPL de la NASA, con un error de pocos minutos de arco entre 1800 y 2050."],[],["transito"]);
G("transito","cielo","Tránsito","","Los planetas de hoy pasando sobre tu carta natal.",
 ["Los tránsitos comparan la posición actual de los planetas con tu carta natal. Cuando un planeta en movimiento forma un aspecto con uno de tus planetas natales, se dice que lo está transitando.","Los tránsitos de planetas lentos (Júpiter, Saturno, Urano, Neptuno y Plutón) duran meses y marcan etapas. Los de planetas rápidos duran horas o días y marcan el clima cotidiano.","Puedes ver tus tránsitos en Astrología, en la pestaña Tránsitos."],[],["retorno-saturno","revolucion-solar"]);
G("retrogrado","cielo","Retrógrado","℞","Cuando un planeta parece moverse hacia atrás.",
 ["Visto desde la Tierra, a veces un planeta parece frenar, detenerse y avanzar hacia atrás durante un tiempo. No se mueve de verdad hacia atrás: es un efecto óptico, como cuando adelantas a otro coche en la autopista y parece que retrocede.","En astrología, un planeta retrógrado vuelca su energía hacia adentro: es un tiempo para revisar, repensar, retomar y corregir más que para empezar. Mercurio retrógrado es el más famoso, asociado a malentendidos, retrasos y fallos tecnológicos.","El Sol y la Luna nunca están retrógrados. En una carta natal, un planeta retrógrado indica una forma más interior o poco convencional de vivir esa energía."],[["Símbolo","℞, una R con una barra"]],["estacion","sombra"]);
G("estacion","cielo","Estación","","El momento en que un planeta se detiene antes de cambiar de dirección.",
 ["Un planeta hace una estación cuando parece detenerse en el cielo: justo antes de ponerse retrógrado (estación retrógrada) o antes de volver a avanzar (estación directa).","Durante los días de la estación, la energía del planeta se siente muy concentrada en ese grado. El calendario de esta app marca con ℞ los días de estación."],[],["retrogrado","sombra"]);
G("sombra","cielo","Sombra retrógrada","","Los días antes y después de un retrógrado.",
 ["Durante un retrógrado, el planeta recorre hacia atrás un tramo del zodiaco que luego volverá a recorrer avanzando. Los días en que pasa por ese tramo antes del retrógrado (presombra) y después (postsombra) se llaman sombra.","Muchos astrólogos dicen que los temas del retrógrado empiezan a asomar en la presombra y terminan de resolverse en la postsombra."],[],["retrogrado","estacion"]);
G("ingreso","cielo","Ingreso","","Cuando un planeta entra en un nuevo signo.",
 ["Un ingreso es el momento en que un planeta cruza al grado 0 de un nuevo signo. Los ingresos de planetas lentos, como Saturno o Plutón, marcan cambios de época colectivos.","En el calendario de esta app, al tocar un día ves los ingresos de esa fecha, incluidos los de la Luna, con la hora exacta."],[],["grados","transito"]);
G("vacia","cielo","Luna vacía de curso","","El rato en que la Luna ya no hace aspectos antes de cambiar de signo.",
 ["La Luna está vacía de curso desde su último aspecto mayor con un planeta en un signo hasta que entra en el siguiente. Puede durar minutos o más de un día.","La tradición dice que en esos periodos lo que se empieza “no llega a nada”, por eso se recomienda no iniciar proyectos importantes y dedicarse a descansar, reflexionar o terminar cosas. Esta app la calcula con los aspectos mayores de la Luna a los planetas del Sol a Plutón: la verás en la tarjeta de la luna del inicio y en el detalle de cada día del calendario."],[],["pl-luna"]);
G("lunacion","cielo","Lunación y fases lunares","","El ciclo de la Luna, de una luna nueva a la siguiente.",
 ["Una lunación es el ciclo completo de la Luna respecto al Sol: dura unos 29 días y medio. Empieza con la luna nueva, cuando Sol y Luna están en conjunción y la Luna no se ve.","Luego viene la creciente, el cuarto creciente (cuadratura), la gibosa creciente, la luna llena (oposición: la Luna totalmente iluminada), la gibosa menguante, el cuarto menguante y la menguante.","En la práctica mágica, la creciente se usa para atraer y hacer crecer, la llena para culminar y potenciar, y la menguante para soltar y limpiar."],[],["eclipse","agua-luna"]);
G("eclipse","cielo","Eclipse","","Una luna nueva o llena cerca de los nodos.",
 ["Un eclipse solar ocurre cuando la Luna nueva pasa delante del Sol; uno lunar, cuando la Tierra proyecta su sombra sobre la Luna llena. Solo ocurren cuando la lunación cae cerca de los nodos lunares, unas dos temporadas al año.","En astrología se consideran lunaciones especialmente potentes, que abren o cierran capítulos. Sus efectos se dice que se sienten durante meses."],[],["nodos","lunacion"]);
G("revolucion-solar","cielo","Revolución solar","","Tu cumpleaños astrológico.",
 ["La revolución solar es el momento exacto en que el Sol vuelve al mismo grado y minuto que tenía cuando naciste. Puede caer el día de tu cumpleaños o uno antes o después.","La carta levantada en ese momento se usa para describir los temas del año que empieza. La app te muestra la fecha y hora en Astrología, pestaña Tránsitos."],[],["revolucion-lunar","transito"]);
G("revolucion-lunar","cielo","Revolución lunar","","Tu mes emocional.",
 ["Cada unos 27 días la Luna vuelve a la posición exacta que tenía cuando naciste: es tu revolución lunar. Se usa para ver el tono emocional del mes que empieza.","Es un buen momento para una tirada personal o para revisar tus intenciones."],[],["revolucion-solar"]);
G("retorno-saturno","cielo","Retorno de Saturno","","La gran prueba de madurez de los 29 años.",
 ["Saturno tarda unos 29 años y medio en volver al lugar donde estaba al nacer. Ese tránsito, el retorno de Saturno, se vive entre los 28 y los 30 años como una etapa de balance: decisiones sobre trabajo, pareja, identidad y responsabilidades.","El segundo retorno llega cerca de los 58-60 años. Hay otros ciclos generacionales parecidos, como la oposición de Urano hacia los 40-42 años."],[],["pl-saturno","transito"]);
G("sinastria","cielo","Sinastría","","Comparar dos cartas natales.",
 ["La sinastría superpone dos cartas para ver cómo se relacionan dos personas: los aspectos entre los planetas de una y otra, y en qué casas de cada una caen los planetas de la otra.","Los contactos clásicos son el Sol de una persona con la Luna de la otra (compatibilidad), Venus con Marte (atracción) y Saturno con planetas personales (compromiso). Puedes verla en Astrología, pestaña Vínculos."],[],["compuesta"]);
G("compuesta","cielo","Carta compuesta","","La carta de la relación misma.",
 ["La carta compuesta se calcula con los puntos medios entre los planetas de dos personas: por ejemplo, el punto exactamente a mitad de camino entre los dos Soles.","El resultado describe la relación como si fuera una tercera entidad, con su propio propósito, sus necesidades y sus retos."],[],["sinastria"]);
G("horoscopo","cielo","Horóscopo","","De la carta del nacimiento a las predicciones del periódico.",
 ["Originalmente, “horóscopo” significaba el Ascendente: del griego hora (hora) y skopos (observador), “el que observa la hora”. Después pasó a designar toda la carta natal.","Los horóscopos de periódico, que se popularizaron en el siglo XX, se basan solo en el signo solar y en las casas contadas desde ese signo. Tu clima de hoy en esta app usa una idea parecida, pero con tu Sol, tu Luna y tu Ascendente reales."],[],["carta-natal"]);

/* ---- Tarot ---- */
G("arcano","tarot","Arcano","","Secreto, misterio: así se llaman las cartas.",
 ["“Arcano” viene del latín arcanum, secreto. Los ocultistas franceses del siglo XIX empezaron a llamar así a las cartas del tarot, y dividieron el mazo en arcanos mayores y menores.","El mazo tiene 78 cartas: 22 arcanos mayores y 56 menores."],[],["mayores","menores"]);
G("mayores","tarot","Arcanos mayores","","Las 22 cartas de los grandes temas de la vida.",
 ["Los arcanos mayores van del 0 (El Loco) al XXI (El Mundo). Representan grandes fuerzas, etapas y lecciones de la vida. Muchas personas los leen como un viaje: el del Loco, que atraviesa cada experiencia hasta llegar a la integración del Mundo.","Cuando aparecen muchos en una tirada, el asunto se considera importante o ligado a procesos profundos. En una baraja cualquiera, se esperaría que fueran un 28% de las cartas."],[],["arcano","menores"]);
G("menores","tarot","Arcanos menores","","Las 56 cartas de la vida cotidiana.",
 ["Los arcanos menores se dividen en cuatro palos (bastos, copas, espadas y oros), cada uno con 10 cartas numeradas del As al Diez y 4 figuras de la corte.","Hablan de situaciones, emociones y acciones del día a día. Los números siguen una progresión: el As es la semilla del elemento, el Cinco la crisis, el Diez la culminación."],[],["palos","corte"]);
G("palos","tarot","Palos","","Bastos, copas, espadas y oros.",
 ["Cada palo corresponde a un elemento y a un área de la vida. Bastos (fuego): voluntad, creatividad, acción. Copas (agua): emociones y vínculos. Espadas (aire): mente, palabra y conflicto. Oros (tierra): cuerpo, dinero y trabajo.","Son los mismos palos de la baraja española. En inglés se llaman wands, cups, swords y pentacles."],[],["elementos","menores"]);
G("corte","tarot","Figuras de la corte","","Sota, caballero, reina y rey.",
 ["Cada palo tiene cuatro figuras. La sota es la aprendiz y mensajera; el caballero, la acción y el movimiento; la reina, el dominio interior del elemento; el rey, su dominio exterior.","Pueden representar a otras personas, aspectos de tu personalidad o etapas de madurez. En el Tarot de Thoth se llaman princesa, príncipe, reina y caballero."],[],["palos"]);
G("invertida","tarot","Carta invertida","","Una carta que sale al revés.",
 ["Cuando una carta sale boca abajo, muchas lectoras la leen como invertida: su energía se bloquea, se retrasa, se vive hacia adentro o se expresa en exceso o en defecto.","No todas las tradiciones usan invertidas. Las que no lo hacen leen todas las cartas al derecho y matizan su sentido según las cartas vecinas. En Ajustes puedes elegir si la app las usa al sacar al azar."],[],["dignidades-elementales"]);
G("tirada","tarot","Tirada","","La forma de colocar las cartas.",
 ["Una tirada es un esquema de posiciones, cada una con un significado: pasado, presente, futuro, obstáculo, consejo… La misma carta se lee distinto según la posición donde cae.","Las tiradas van desde una sola carta hasta la cruz celta de diez. En esta app puedes crear tus propias tiradas en Diario, botón “Mis tiradas”."],[],["cruz-celta","significadora"]);
G("cruz-celta","tarot","Cruz celta","","La tirada clásica de diez cartas.",
 ["La cruz celta se hizo famosa con el libro de Waite de 1910. Seis cartas forman una cruz (situación, desafío, base, pasado, posibilidades y futuro cercano) y cuatro forman una columna a la derecha (tú, tu entorno, esperanzas y miedos, resultado).","Pese a su nombre, no hay pruebas de que provenga de los antiguos celtas."],[],["tirada"]);
G("significadora","tarot","Significadora","","Una carta elegida para representar a quien consulta.",
 ["Antiguamente se elegía una carta, a menudo una figura de la corte, para representar a la persona que pregunta, y se colocaba en el centro de la tirada. Waite la incluye en su método de la cruz celta.","Hoy muchas lectoras no la usan y dejan que el mazo hable completo."],[],["corte","tirada"]);
G("dignidades-elementales","tarot","Dignidades elementales","","Leer cómo se llevan las cartas vecinas según sus elementos.",
 ["Es una técnica de la Golden Dawn para leer sin invertidas. Las cartas del mismo elemento se refuerzan; las de elementos afines (fuego con aire, agua con tierra) se apoyan; las de elementos opuestos (fuego con agua, aire con tierra) se debilitan mutuamente.","El asistente de interpretación de esta app aplica esta técnica a las cartas vecinas de tus tiradas."],[],["elementos","invertida"]);
G("rws","tarot","Rider-Waite-Smith","","El mazo más influyente del siglo XX.",
 ["Publicado en Londres en 1909 por la editorial Rider. Lo concibió Arthur Edward Waite y lo ilustró Pamela Colman Smith, ambos miembros de la Golden Dawn.","Su gran novedad fue ilustrar con escenas todos los arcanos menores, lo que hizo el tarot mucho más fácil de aprender. La mayoría de los mazos modernos se basan en él."],[],["golden-dawn","marsella","thoth"]);
G("marsella","tarot","Tarot de Marsella","","El estilo clásico francés.",
 ["El Tarot de Marsella es un estilo de barajas grabadas en madera e impresas en Francia desde el siglo XVII. Sus arcanos menores muestran solo los símbolos del palo, como una baraja común.","Es muy usado en el mundo hispanohablante. En él La Fuerza es el arcano XI y La Justicia el VIII, al revés que en el Rider-Waite-Smith."],[],["rws"]);
G("thoth","tarot","Tarot de Thoth","","El mazo de Crowley y Frieda Harris.",
 ["Diseñado por Aleister Crowley y pintado por Lady Frieda Harris entre 1938 y 1943, y publicado en 1969. Está cargado de simbolismo astrológico, cabalístico y alquímico.","Cambia algunos nombres: La Fuerza es Lujuria, La Templanza es Arte, y las figuras de la corte son princesa, príncipe, reina y caballero."],[],["rws"]);
G("golden-dawn","tarot","Golden Dawn","","La orden que unió tarot, astrología y cábala.",
 ["La Orden Hermética de la Aurora Dorada fue una sociedad ocultista fundada en Londres en 1888. Sistematizó las correspondencias entre las cartas, los signos, los planetas, los elementos y las letras hebreas.","Casi todo el tarot moderno, incluido el Rider-Waite-Smith y el Thoth, se basa en su sistema. Las correspondencias que ves en las fichas de esta app siguen su modelo."],[],["rws","decanos-tarot","letras-hebreas"]);
G("letras-hebreas","tarot","Letras hebreas","","Las 22 letras asignadas a los 22 arcanos mayores.",
 ["En el siglo XIX, Éliphas Lévi relacionó los 22 arcanos mayores con las 22 letras del alfabeto hebreo, y la Golden Dawn fijó el sistema que se usa hoy: Álef para El Loco, Bet para El Mago, y así hasta Tav para El Mundo.","Cada letra tiene un significado literal (Álef es buey, Bet es casa) que enriquece el simbolismo de la carta. Puedes practicarlas en Cartas, modo Correspondencias."],[],["golden-dawn","mayores"]);
G("decanos-tarot","tarot","Decanatos en el tarot","","Las cartas del 2 al 10 y los 36 decanatos.",
 ["La Golden Dawn asignó a las 36 cartas menores numeradas del 2 al 10 los 36 decanatos del zodiaco. Cada palo cubre los tres signos de su elemento: los bastos van con Aries, Leo y Sagitario, por ejemplo.","Así, el Tres de Bastos es el Sol en Aries y el Diez de Espadas es el Sol en Géminis. Los ases representan la raíz de cada elemento."],[],["decanato","golden-dawn"]);
G("numerologia","tarot","Numerología en el tarot","","Los números de las cartas como clave de lectura.",
 ["Cada número tiene un sentido: el 1 inicio, el 2 dualidad, el 3 creación, el 4 estructura, el 5 crisis, el 6 armonía, el 7 prueba, el 8 poder, el 9 culminación y el 10 cierre de ciclo.","Las cartas que se reducen al mismo número forman familias: La Rueda (10) y El Sol (19) se reducen a El Mago (1). Cuando un número se repite en una tirada, su tema gana peso."],[],["carta-nacimiento"]);
G("carta-nacimiento","tarot","Carta de nacimiento y carta del año","","Los arcanos que te acompañan según tu fecha.",
 ["La carta de nacimiento se calcula sumando día, mes y año de nacimiento y reduciendo el resultado hasta que sea 21 o menos. Si da un número de dos cifras, también se reduce a una, y ambas cartas forman tu par.","La carta del año usa tu día y mes de nacimiento con el año en curso, y describe el tema de ese año. Estos métodos los popularizó la autora Mary K. Greer. Tu carta de nacimiento y tu carta del año aparecen en tu carta natal."],[],["numerologia"]);
G("oraculo","tarot","Oráculo y Lenormand","","Otros sistemas de cartas.",
 ["Un oráculo es cualquier baraja de adivinación que no sigue la estructura fija del tarot: puede tener cualquier número de cartas y cualquier tema.","El Petit Lenormand es un sistema de 36 cartas con imágenes sencillas (la casa, el barco, el trébol) que se leen en combinaciones. Lleva el nombre de la adivina francesa Marie Anne Lenormand, aunque se publicó después de su muerte."],[],["tirada"]);

/* ---- Magia y práctica ---- */
G("intencion","magia","Intención","","El propósito claro detrás de un ritual o una tirada.",
 ["En casi todas las tradiciones mágicas modernas, la intención es el corazón del trabajo: saber exactamente qué quieres y por qué. Los objetos, palabras y momentos lunares sirven para enfocarla.","Una buena intención es concreta, está formulada en positivo y depende de ti. Puedes escribirla en tu grimorio, en la sección de Intenciones."],[],["correspondencias"]);
G("correspondencias","magia","Correspondencias","","Las afinidades simbólicas entre cosas.",
 ["La idea de correspondencia sostiene que todo está conectado por afinidades: un color, una hierba, un planeta, un día de la semana y un metal pueden compartir una misma cualidad. Venus, el viernes, el color rosa, la rosa y el cobre se asocian al amor.","Al elegir ingredientes con correspondencias afines a tu intención, el ritual gana coherencia simbólica. Puedes consultarlas y añadir las tuyas en Grimorio, pestaña Correspondencias."],[],["dias-planetarios","horas-planetarias"]);
G("dias-planetarios","magia","Días planetarios","","Cada día de la semana regido por un planeta.",
 ["Los nombres de los días en español conservan los planetas clásicos: lunes de la Luna, martes de Marte, miércoles de Mercurio, jueves de Júpiter, viernes de Venus. El sábado viene del hebreo shabat, pero se asocia a Saturno (en inglés, Saturday), y el domingo, “día del Señor”, al Sol (Sunday).","En magia se elige el día cuyo planeta coincide con la intención: viernes para el amor, jueves para la prosperidad, sábado para protección y cierres."],[],["horas-planetarias","correspondencias"]);
G("horas-planetarias","magia","Horas planetarias","","Cada hora del día regida por un planeta.",
 ["En la tradición mágica, el día (de la salida a la puesta de sol) y la noche se dividen cada uno en doce “horas” desiguales. Cada hora está regida por un planeta, siguiendo el orden caldeo: Saturno, Júpiter, Marte, Sol, Venus, Mercurio y Luna.","La primera hora de cada día está regida por el planeta del día, y de ahí vienen precisamente los nombres de la semana. Puedes verlas en la tarjeta Horas planetarias del inicio, calculadas con la salida y la puesta del sol del lugar que elijas en Ajustes, y elegir una hora ideal para cada ritual."],[],["dias-planetarios"]);
G("altar","magia","Altar","","Un espacio dedicado a tu práctica.",
 ["Un altar es un lugar, grande o pequeño, donde reúnes objetos significativos: velas, cristales, cartas, fotos, flores, elementos de la naturaleza. Sirve para enfocar la atención y marcar el inicio de un trabajo.","Muchas practicantes representan en él los cuatro elementos: una vela (fuego), un cuenco de agua (agua), incienso o una pluma (aire) y sal o una piedra (tierra)."],[],["consagrar"]);
G("consagrar","magia","Consagrar y cargar","","Dedicar un objeto a un propósito.",
 ["Consagrar es dedicar un objeto (una vela, un mazo, un cristal) a un uso sagrado o a una intención. Cargarlo es llenarlo de esa intención, por ejemplo sosteniéndolo con las manos, a la luz de la luna o pasándolo por humo.","Antes de consagrar algo suele limpiarse, para empezar desde cero."],[],["limpieza","agua-luna"]);
G("limpieza","magia","Limpieza energética","","Quitar lo pesado de una persona, objeto o espacio.",
 ["Una limpieza busca retirar energías estancadas o ajenas. Se hace con humo (sahumerio), con agua y hierbas (despojo), con sal, con sonido (campanas, aplausos) o con un huevo (limpia).","Suele hacerse en luna menguante y antes de un trabajo importante. Encontrarás varias en Grimorio, Rituales, Tradiciones."],[],["despojo","sahumerio"]);
G("despojo","magia","Despojo","","Un baño o ritual para desprenderse de lo que pesa.",
 ["En las tradiciones populares del Caribe y Venezuela, despojar es quitarse de encima malas energías, envidias o cansancio, sobre todo con baños de hierbas como ruda, albahaca o romero.","Se dice que el agua se vierte del cuello hacia abajo, y que al terminar conviene secarse sin frotar."],[],["limpieza"]);
G("sahumerio","magia","Sahumerio","","Limpiar con el humo de hierbas y resinas.",
 ["Sahumar es quemar hierbas o resinas, como copal, mirra, romero o palo santo, y llevar el humo por un espacio o alrededor del cuerpo. Es una práctica antigua en muchas culturas americanas, europeas y asiáticas.","Se recorre la casa de adentro hacia la puerta, con las ventanas abiertas para que lo pesado salga."],[],["limpieza"]);
G("destierro","magia","Destierro e invocación","","Alejar y llamar.",
 ["En la magia ceremonial, desterrar es alejar influencias de un espacio, e invocar es llamar a una fuerza o presencia. El ritual menor del pentagrama de la Golden Dawn es el ejemplo clásico de destierro.","En la magia popular, lo equivalente es limpiar antes de pedir, y cerrar después de trabajar."],[],["pentagrama","circulo"]);
G("circulo","magia","Círculo mágico","","Un espacio protegido para trabajar.",
 ["Muchas tradiciones trazan un círculo, real o imaginario, alrededor del lugar del ritual. Delimita un espacio protegido donde se concentra la energía.","Se suele abrir llamando a los cuatro puntos cardinales o elementos, y cerrar agradeciéndoles al terminar."],[],["destierro","altar"]);
G("pentagrama","magia","Pentagrama y pentáculo","⛤","La estrella de cinco puntas.",
 ["El pentagrama es una estrella de cinco puntas trazada con una sola línea. Desde la Antigüedad se usó como signo de protección. En la tradición occidental, cada punta representa un elemento (fuego, agua, aire, tierra) y la superior el espíritu.","El pentáculo es un pentagrama dentro de un círculo, o un disco con símbolos grabados. Da nombre al palo de oros en el tarot inglés (pentacles)."],[],["palos","destierro"]);
G("agua-luna","magia","Agua lunar","","Agua que ha recibido la luz de la luna.",
 ["Es agua que se deja una noche bajo la luz de la luna, sobre todo llena, para cargarla con su energía. Se usa en baños, limpiezas, para regar plantas o consagrar objetos.","Es una práctica moderna muy extendida. Encontrarás el paso a paso en Tradiciones."],[],["lunacion","consagrar"]);
G("grimorio-t","magia","Grimorio y Libro de las Sombras","","El libro de trabajo de quien practica magia.",
 ["Un grimorio es un libro de magia: recetas, rituales, correspondencias y conjuros. Los grimorios históricos más famosos son de la Edad Media y el Renacimiento, como la Clavícula de Salomón.","En la Wicca, el libro personal se llama Libro de las Sombras. Esta app es, en el fondo, tu grimorio digital: lecturas, rituales, intenciones y notas en un solo lugar."],[],["intencion"]);
G("brujeria","magia","Brujería, Wicca y magia ceremonial","","Tres caminos distintos.",
 ["La brujería tradicional o popular abarca prácticas transmitidas en familias y comunidades: hierbas, limpiezas, amuletos, rezos. Varía muchísimo según la región.","La Wicca es una religión neopagana fundada en Inglaterra a mediados del siglo XX, con Gerald Gardner como figura central. Celebra los ciclos de la naturaleza y venera a una diosa y un dios.","La magia ceremonial, como la de la Golden Dawn, es una tradición más intelectual y ritualizada, con cábala, astrología y fórmulas precisas."],[],["golden-dawn","grimorio-t"]);

/* ---- Interfaz ---- */
const GLO_BY=Object.fromEntries(GLO.map(x=>[x.id,x]));
const GLO_SYMBOLS=[["Planetas",["pl-sol","pl-luna","pl-mercurio","pl-venus","pl-marte","pl-jupiter","pl-saturno","pl-urano","pl-neptuno","pl-pluton"]],["Otros puntos",["nodos","quiron","lilith","fortuna","ascendente","descendente","mediocielo","fondocielo","retrogrado"]],["Signos",ZOD.map(z=>"sg-"+z.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase())],["Aspectos",["as-conjuncion","as-sextil","as-cuadratura","as-trigono","as-oposicion","as-quincuncio","as-semisextil","as-semicuadratura","as-sesquicuadratura","as-quintil"]]];
const glyphOf=x=>x.g?x.g.split(" ").map(c=>/^[A-Z0-9°′–]+$/.test(c)?c:c+"\uFE0E").join(" "):"";
function renderGlosario(){
  const tog=`<div class="seg" role="group" style="margin-bottom:12px"><button data-act="gloMode" data-m="leer" aria-pressed="${st.gloMode==="leer"}">Leer</button><button data-act="gloMode" data-m="estudiar" aria-pressed="${st.gloMode==="estudiar"}">Estudiar</button></div>`;
  if(st.gloMode==="estudiar"){$("#main").innerHTML=tog+`<div id="gloList"></div>`;renderGloStudy();return}
  $("#main").innerHTML=tog+`<input type="search" placeholder="Buscar un término" data-bind="gloSearch" value="${esc(st.gloSearch)}">
  <div class="chips scroll" style="margin:12px 0">${[["","Todo"]].concat(GLO_CATS).map(([k,n])=>`<button class="chip" data-act="gloCat" data-c="${k}" aria-pressed="${st.gloCat===k}">${n}</button>`).join("")}</div>
  <div id="gloList"></div>`;
  renderGloList();
}
function renderGloList(){
  const q=st.gloSearch.trim().toLowerCase(),el=$("#gloList");
  if(st.gloCat==="simbolos"&&!q){
    el.innerHTML=GLO_SYMBOLS.map(([title,ids])=>`<h3 class="grouph">${title}</h3><div class="symgrid">${ids.map(id=>{const x=GLO_BY[id];return x?`<button class="symtile" data-act="gloOpen" data-id="${id}"><span class="sg">${glyphOf(x)}</span><span>${esc(x.t.split(" o ")[0])}</span></button>`:""}).join("")}</div>`).join("");return}
  let list=GLO;if(st.gloCat&&st.gloCat!=="simbolos")list=list.filter(x=>x.cat===st.gloCat);
  if(q)list=list.filter(x=>[x.t,x.s,x.b.join(" "),x.d.map(d=>d.join(" ")).join(" ")].join(" ").toLowerCase().includes(q));
  const groups={};list.forEach(x=>(groups[x.cat]||(groups[x.cat]=[])).push(x));
  el.innerHTML=GLO_CATS.filter(([k])=>groups[k]).map(([k,n])=>`<h3 class="grouph">${n}</h3>${groups[k].map(x=>`<button class="ritem compact gitem" data-act="gloOpen" data-id="${x.id}">${x.g?`<span class="gg">${glyphOf(x)}</span>`:""}<span><span class="rq" style="margin:0;display:block">${esc(x.t)}</span><span class="small muted">${esc(x.s)}</span></span></button>`).join("")}`).join("")||`<div class="empty">No encontré ese término.</div>`;
}
function gloSheet(id){
  const x=GLO_BY[id],cat=GLO_CATS.find(c=>c[0]===x.cat)[1];
  return sheetHead(x.t)+`<div class="sbody glo">
   ${x.g?`<div class="bigglyph">${glyphOf(x)}</div>`:""}
   <p class="muted" style="text-align:center;margin-top:0">${cat}</p>
   <p class="lead">${esc(x.s)}</p>
   ${x.b.map(p=>`<p>${esc(p)}</p>`).join("")}

/* Quirón: elementos orbitales osculantes aproximados (eclíptica J2000) */
const CHIRON={a:13.6481,e:0.37913,i:6.9311,O:209.3721,w:339.3990,Tp:2450123.5};
function chironLon(date){
  const JD=julian(date),T=(JD-2451545)/36525,c=CHIRON,n=0.9856076686/Math.pow(c.a,1.5);
  const M=norm(n*(JD-c.Tp))*RAD,e=c.e;let E=M+e*Math.sin(M);for(let i=0;i<12;i++)E=E-(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));
  const xp=c.a*(Math.cos(E)-e),yp=c.a*Math.sqrt(1-e*e)*Math.sin(E),om=c.w*RAD,Om=c.O*RAD,I=c.i*RAD;
  const co=Math.cos(om),so=Math.sin(om),cO=Math.cos(Om),sO=Math.sin(Om),cI=Math.cos(I);
  const x=(co*cO-so*sO*cI)*xp+(-so*cO-co*sO*cI)*yp,y=(co*sO+so*cO*cI)*xp+(-so*sO+co*cO*cI)*yp,ea=helio("tierra",T);
  return norm(Math.atan2(y-ea[1],x-ea[0])/RAD+PREC*T);
}

const VOC_PL=["sol","mercurio","venus","marte","jupiter","saturno","urano","neptuno","pluton"];
const VOC_T=[0,60,90,120,180,240,270,300];
function moonSignBounds(t){
  const H=3600e3,s=sgn(planetLon("luna",t));let a=t.getTime(),b=a;
  while(sgn(planetLon("luna",new Date(a-H)))===s)a-=H;
  let lo=a-H,hi=a;for(let i=0;i<22;i++){const m=(lo+hi)/2;sgn(planetLon("luna",new Date(m)))===s?hi=m:lo=m}const en=hi;
  while(sgn(planetLon("luna",new Date(b+H)))===s)b+=H;
  lo=b;hi=b+H;for(let i=0;i<22;i++){const m=(lo+hi)/2;sgn(planetLon("luna",new Date(m)))===s?lo=m:hi=m}
  return [en,hi,s];
}
const vocCache={};
function vocPeriod(t){
  const [en,ex,s]=moonSignBounds(t),key=Math.round(en/6e4);if(vocCache[key])return vocCache[key];
  const H=3600e3;let last=null,lastInfo=null;
  VOC_PL.forEach(p=>{
    const h=tt=>{const d=norm(planetLon("luna",new Date(tt))-planetLon(p,new Date(tt)));return d};
    let prevT=en,prevD=h(en);
    for(let tt=en+H;tt<=ex+1;tt=Math.min(tt+H,ex)){
      const d=h(tt);
      VOC_T.forEach(tg=>{const f0=((prevD-tg+540)%360)-180,f1=((d-tg+540)%360)-180;
        if(f0<0&&f1>=0&&f1-f0<60){let lo=prevT,hi=tt;for(let i=0;i<24;i++){const m=(lo+hi)/2,fm=((h(m)-tg+540)%360)-180;fm<0?lo=m:hi=m}if(hi<=ex&&(!last||hi>last)){last=hi;lastInfo={p,asp:tg>180?360-tg:tg}}}});
      prevT=tt;prevD=d;if(tt>=ex)break;
    }
  });
  return vocCache[key]={start:new Date(last||en),end:new Date(ex),sign:s,next:(s+1)%12,last:lastInfo};
}

  let t=new Date(d0.getTime());

/* Salida y puesta del sol, horas planetarias */
function sunTimes(y,m,d,lat,lon){
  const n=(Date.UTC(y,m,d,12)/864e5+2440587.5)-2451545;
  const L=norm(280.460+0.9856474*n),g=norm(357.528+0.9856003*n)*RAD;
  const lam=(L+1.915*Math.sin(g)+0.020*Math.sin(2*g))*RAD,eps=(23.439-0.0000004*n)*RAD;
  const dec=Math.asin(Math.sin(eps)*Math.sin(lam)),ra=norm(Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam))/RAD);
  const eot=4*(((L-ra+540)%360)-180),noon=720-4*lon-eot,f=lat*RAD;
  const cosH=(Math.sin(-0.833*RAD)-Math.sin(f)*Math.sin(dec))/(Math.cos(f)*Math.cos(dec));
  const H=Math.acos(Math.max(-1,Math.min(1,cosH)))/RAD,base=Date.UTC(y,m,d);
  return {rise:new Date(base+(noon-4*H)*6e4),set:new Date(base+(noon+4*H)*6e4)};
}

function planetaryHours(now=new Date()){
  const L=myLoc();let day=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  let st0=sunTimes(day.getFullYear(),day.getMonth(),day.getDate(),L.lat,L.lon);
  if(now<st0.rise){day=new Date(day.getTime()-864e5);st0=sunTimes(day.getFullYear(),day.getMonth(),day.getDate(),L.lat,L.lon)}
  const nx=new Date(day.getTime()+864e5),st1=sunTimes(nx.getFullYear(),nx.getMonth(),nx.getDate(),L.lat,L.lon);
  const dl=(st0.set-st0.rise)/12,nl=(st1.rise-st0.set)/12,startIdx=CH_ORDER.indexOf(DAY_RULER[day.getDay()]),out=[];
  for(let i=0;i<24;i++){const s=i<12?st0.rise.getTime()+dl*i:st0.set.getTime()+nl*(i-12),e=s+(i<12?dl:nl);out.push({i,start:new Date(s),end:new Date(e),p:CH_ORDER[(startIdx+i)%7],day:i<12})}
  return {day,rise:st0.rise,set:st0.set,hours:out,ruler:DAY_RULER[day.getDay()]};
}

}

function yearCards(birthK,year){

function freeSpot(lay){
  const cands=[];for(let y=15;y<=85;y+=17.5)for(let x=12;x<=88;x+=19)cands.push({x,y});
  cands.sort((a,b)=>Math.hypot(a.x-50,a.y-50)-Math.hypot(b.x-50,b.y-50));
  const f=cands.find(c=>lay.every(l=>Math.abs(l.x-c.x)>12||Math.abs(l.y-c.y)>15));return Object.assign({r:0},f||{x:50,y:50});
}

/* Arrastrar en el lienzo */
(function(){
  let drag=null;
  document.addEventListener("pointerdown",e=>{
    const c=e.target.closest(".spcanvas.edit .spcard");if(!c)return;
    const cv=c.parentElement,r=cv.getBoundingClientRect(),i=+c.dataset.i,L=st.spDraft.layout[i];
    drag={c,cv,r,i,sx:e.clientX,sy:e.clientY,ox:L.x,oy:L.y,moved:false};c.setPointerCapture(e.pointerId);e.preventDefault();
  });
  document.addEventListener("pointermove",e=>{
    if(!drag)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
    if(!drag.moved&&Math.hypot(dx,dy)<6)return;drag.moved=true;
    const L=st.spDraft.layout[drag.i],snap=v=>Math.round(v*2)/2;
    L.x=Math.max(6,Math.min(94,snap(drag.ox+dx/drag.r.width*100)));L.y=Math.max(8,Math.min(92,snap(drag.oy+dy/drag.r.height*100)));
    drag.c.style.left=L.x+"%";drag.c.style.top=L.y+"%";drag.c.classList.add("dragging");
  });
  const end=()=>{if(!drag)return;const d=drag;drag=null;d.c.classList.remove("dragging");if(!d.moved){st.spSel=d.i;refreshSheet()}};
  document.addEventListener("pointerup",end);document.addEventListener("pointercancel",end);
})();

}

async function exportData(){
  const json=JSON.stringify({app:"grimorio",version:5,exportedAt:new Date().toISOString(),data:DB},null,2);
  const name=`grimorio-respaldo-${dkey()}.json`,file=new File([json],name,{type:"application/json"});
  const mark=()=>{DB.lastBackup=new Date().toISOString();save();render()};
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});mark();toast("Respaldo guardado");return}}
  catch(e){if(e.name==="AbortError")return}
  const url=URL.createObjectURL(file),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);mark();toast("Respaldo descargado");
}
function importData(file){
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const obj=JSON.parse(fr.result),data=obj.app==="grimorio"?obj.data:obj;
      if(!data||!Array.isArray(data.readings))throw new Error("formato");
      if(!confirm(`Esto reemplazará tus datos actuales (${DB.readings.length} lecturas) por los del respaldo (${data.readings.length} lecturas). ¿Continuar?`))return;
      DB=normalize(data);save();applyTheme();applyComfort();render();toast("Respaldo restaurado");
    }catch(e){alert("Ese archivo no es un respaldo del Grimorio. Elige el archivo .json que guardaste desde Ajustes.")}
  };
  fr.readAsText(file);
}

  wipe:()=>{if(!confirm("¿Borrar TODO: lecturas, cartas del día, notas, combinaciones, rituales, intenciones y cartas natales?"))return;if(!confirm("Última confirmación: esto no se puede deshacer. ¿Borrar todo?"))return;DB=defaults();save();applyTheme();render();toast("Datos borrados")}
};
function persistRitual(quiet){
  const d=st.rDraft;if(!d.title.trim()){alert("Ponle un nombre al ritual.");return false}
  d.title=d.title.trim();d.updated=new Date().toISOString();
  if(d.id){const i=DB.rituals.findIndex(r=>r.id===d.id);i<0?DB.rituals.push(JSON.parse(JSON.stringify(d))):DB.rituals[i]=JSON.parse(JSON.stringify(d))}
  else{d.id="r"+uid();d.created=d.updated;DB.rituals.push(JSON.parse(JSON.stringify(d)))}
  save();return true;
}
function persistIntent(){
  const d=st.iDraft;if(!d.text.trim()){alert("Escribe tu intención.");return false}
  const clean=Object.assign({},d);delete clean.cyc;clean.text=clean.text.trim();
  if(d.id){const i=DB.intentions.findIndex(x=>x.id===d.id);DB.intentions[i]=clean}else{clean.id=d.id="i"+uid();clean.created=new Date().toISOString();DB.intentions.push(clean)}
  save();return true;
}
function afterSheetChange(){if(SHEETS.length>1)popSheet();else closeSheet()}
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(el&&ACT[el.dataset.act]){e.preventDefault();ACT[el.dataset.act](el,e)}});

  search:el=>{st.search=el.value;renderReadingList()},
  lecFilter:el=>{st.filter=el.value;renderReadingList()},
  gsearch:el=>{st.gq=el.value;$("#gres").innerHTML=searchResults()},
  tradSearch:el=>{st.tradSearch=el.value;const q=el.value.trim().toLowerCase();$("#tradList").innerHTML=tradList(TRADITIONS.filter(r=>!q||[r.t,r.type,r.origin,r.src,r.mat.join(" "),r.steps.join(" ")].join(" ").toLowerCase().includes(q)))},
  gloSearch:el=>{st.gloSearch=el.value;renderGloList()},
  planDate:el=>st.planDate=el.value,planNote:el=>st.planNote=el.value,pickNote:el=>st.pickNote=el.value,
  gloKind:el=>{st.gloKind=el.value;st.gq2=null;renderGloStudy()},
  wideLines:el=>{DB.settings.wideLines=el.checked;save();applyComfort()},
  loc:el=>{const opts=VE_CITIES.map(c=>[c[0]+", Venezuela",c[1],c[2]]).concat(WORLD_CITIES.map(c=>[c[0],c[1],c[2]])),o=opts[+el.value];DB.settings.loc={name:o[0].replace(", Venezuela",""),lat:o[1],lon:o[2]};save();toast("Ubicación: "+o[0])},
  homeOn:el=>{DB.settings.homeOff[el.dataset.k]=!el.checked;save()},
  astroChart:el=>{st.chartId=el.value;renderChartTab()},
  "ch.name":el=>st.chDraft.name=el.value,"ch.mine":el=>{st.chDraft.mine=el.checked;refreshSheet()},"ch.relation":el=>st.chDraft.relation=el.value,
  bondSel:el=>{st.bondId=el.value;st.bondAll=false;renderBonds()},
  bondNote:el=>{const c=DB.charts.find(x=>x.id===el.dataset.id);if(c){c.bondNote=el.value;saveSoon()}},"ch.date":el=>st.chDraft.date=el.value,"ch.time":el=>st.chDraft.time=el.value,
  "ch.noTime":el=>{st.chDraft.noTime=el.checked;refreshSheet()},"ch.lat":el=>st.chDraft.lat=el.value,"ch.lon":el=>st.chDraft.lon=el.value,"ch.offset":el=>st.chDraft.offset=el.value,
  "ch.dst":el=>st.chDraft.dst=el.checked,"ch.place":el=>st.chDraft.place=el.value,"ch.houses":el=>st.chDraft.houses=el.value,
  "ch.city":el=>{const d=st.chDraft,v=el.value;d.cityKey=v;
    if(v.startsWith("ve")){const c=VE_CITIES[+v.slice(2)];Object.assign(d,{tzMode:"ve",lat:c[1],lon:c[2],place:c[0]+", Venezuela",dst:false})}
    else if(v.startsWith("w")){const c=WORLD_CITIES[+v.slice(1)];Object.assign(d,{tzMode:"manual",lat:c[1],lon:c[2],offset:c[3],place:c[0]})}
    else if(v==="manual")Object.assign(d,{tzMode:"manual",lat:"",lon:"",offset:"",place:""});
    refreshSheet()},
  ritSearch:el=>{st.ritSearch=el.value;renderRituals();const i=$("[data-bind=ritSearch]");i.focus();i.setSelectionRange(i.value.length,i.value.length)},
  corrSearch:el=>{st.corrSearch=el.value;renderCorrList()},
  corrCat:el=>{st.corrCat=el.value;renderCorrList()},
  corrNote:el=>{DB.corrNotes[el.dataset.id]=el.value;saveSoon()},
  "r.title":el=>st.rDraft.title=el.value,"r.purpose":el=>st.rDraft.purpose=el.value,"r.steps":el=>st.rDraft.steps=el.value,"r.notes":el=>st.rDraft.notes=el.value,"r.type":el=>st.rDraft.type=el.value,
  "r.ingredients":el=>{st.rDraft.ingredients=el.value;$("#ritCorr").innerHTML=corrChips(corrInText(el.value))},
  "r.phase":el=>{st.rDraft.phase=el.value;updRitNext()},"r.sign":el=>{st.rDraft.sign=el.value;updRitNext()},"r.weekday":el=>{st.rDraft.weekday=el.value;updRitNext()},"r.hour":el=>{st.rDraft.hour=el.value;updRitNext()},
  "l.date":el=>st.logDraft.date=el.value,"l.notes":el=>st.logDraft.notes=el.value,"l.reviewIn":el=>st.logDraft.reviewIn=el.value,"l.outcome":el=>st.logDraft.outcome=el.value,"l.followup":el=>st.logDraft.followup=el.value,
  "i.text":el=>st.iDraft.text=el.value,"i.plan":el=>st.iDraft.plan=el.value,"i.fullNote":el=>st.iDraft.fullNote=el.value,"i.status":el=>st.iDraft.status=el.value,"i.closeNote":el=>st.iDraft.closeNote=el.value,
  "c.name":el=>st.cDraft.name=el.value,"c.cat":el=>st.cDraft.cat=el.value,"c.el":el=>st.cDraft.el=el.value,"c.planet":el=>st.cDraft.planet=el.value,"c.txt":el=>st.cDraft.txt=el.value,"c.caution":el=>st.cDraft.caution=el.value,
  "d.reviewIn":el=>{draft.reviewIn=el.value;const p=$("#reviewPrev");if(p)p.textContent=reviewPreview()},
  "sp.name":el=>st.spDraft.name=el.value,
  "sp.desc":el=>st.spDraft.desc=el.value,
  "sp.pos":el=>{st.spDraft.pos[+el.dataset.i]=el.value;const c=$(`.spcanvas.edit .spcard[data-i="${el.dataset.i}"] .spname`);if(c)c.textContent=trunc(el.value,22)},"sp.pdesc":el=>st.spDraft.pdesc[+el.dataset.i]=el.value,
  defaultReview:el=>{DB.settings.defaultReview=el.value;save()},
  badge:el=>{if(el.checked&&window.Notification&&Notification.permission!=="granted"){Notification.requestPermission().then(p=>{DB.settings.badge=p==="granted";if(p!=="granted")alert("Para mostrar el número en el ícono, iOS necesita que permitas las notificaciones de la app.");save();renderAjustes();updateBadge()});return}DB.settings.badge=el.checked;save();updateBadge()},
  dailyNote:el=>{const d=DB.daily[dkey()];if(d){d.note=el.value;saveSoon()}},
  "d.date":el=>{draft.date=el.value;const p=$("#reviewPrev");if(p)p.textContent=reviewPreview();if(st.assistOpen)renderAssist()},
  "d.question":el=>draft.question=el.value,
  "d.interp":el=>draft.interp=el.value,
  "d.followup":el=>draft.followup=el.value,
  "d.followDate":el=>draft.followDate=el.value,
  "d.outcome":el=>{draft.outcome=el.value;if(el.value&&!draft.followDate){draft.followDate=dkey();const f=$("#sheet [data-bind='d.followDate']");if(f)f.value=draft.followDate}},
  "d.spread":el=>{const old=draft.cards;draft.spread=el.value;draft.cards=positionsFor(el.value,old.length,old).map((p,i)=>({pos:p,id:old[i]?.id||"",rev:old[i]?.rev||false}));refreshSheet()},
  "d.card":el=>{const i=+el.dataset.i;if(el.value&&usedIds(i).has(el.value)){alert("Esa carta ya está en esta tirada.");el.value=draft.cards[i].id;return}draft.cards[i].id=el.value;renderDraftCards()},
  "d.rev":el=>{draft.cards[+el.dataset.i].rev=el.checked;renderDraftCards()},
  studyMode:el=>{st.studyMode=el.value;st.q=null;st.studyShown=false;renderStudy()},
  studyGroup:el=>{st.studyGroup=el.value;st.studyCur=null;st.q=null;renderStudy()},
  "fis.card":el=>{st.fis.id=el.value;st.fis.shown=false;renderStudy()},
  "fis.rev":el=>{st.fis.rev=el.checked;if(st.fis.shown)renderStudy()},
  "fis.text":el=>{st.fis.text=el.value;const b=$("[data-act='fisSave']");if(b)b.disabled=!el.value.trim()},
  catGroup:el=>{st.catGroup=el.value;renderCatalogGrid()},
  catSearch:el=>{st.catSearch=el.value;renderCatalogGrid()},
  comboSearch:el=>{st.comboSearch=el.value;renderComboList()},
  "combo.a":el=>{st.comboDraft.a=el.value;syncCombo()},

  reversals:el=>{DB.settings.reversals=el.checked;save()},
  importFile:el=>{if(el.files[0])importData(el.files[0])}
};
function updRitNext(){const p=$("#ritNext");if(p)p.innerHTML=nextIdealText(st.rDraft,nextIdeal(st.rDraft));const h=$("#ritHours");if(h)h.innerHTML=ritHoursText(st.rDraft)}
function ritHoursText(d){if(!d.hour)return"";const hs=nextHoursOf(d.hour,new Date(),4);return `Próximas horas de ${PL[d.hour].name}: ${hs.map(h=>`${dkey(h.start)===dkey()?"hoy":fmtShort(dkey(h.start))} a las ${fmtTime(h.start)}`).join("; ")}`}
function syncCombo(){const d=st.comboDraft;if(d.a&&d.b){const ex=DB.combos[comboKey(d.a,d.b)];if(ex){d.note=ex.note;d.origKey=comboKey(d.a,d.b)}}refreshSheet()}
function onBind(e){
  const el=e.target.closest("[data-bind]");if(!el||!BIND[el.dataset.bind])return;
  const discrete=el.tagName==="SELECT"||el.type==="checkbox"||el.type==="file";
  if(e.type==="input"&&discrete)return;
  if(e.type==="change"&&!discrete&&el.type!=="date")return;
  BIND[el.dataset.bind](el);
}
document.addEventListener("input",onBind);
document.addEventListener("change",onBind);

let lastDay=dkey();
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&dkey()!==lastDay){lastDay=dkey();if($("#sheet").hidden)render()}});
window.addEventListener("pagehide",save);

applyTheme();applyComfort();render();probeArt();
