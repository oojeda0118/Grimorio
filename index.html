<style>
:root{
  --bg:#efecf4; --surface:#faf8fd; --surface2:#e5e0ee; --text:#241e38; --muted:#6a6280;
  --line:#d8d1e4; --accent:#5a3a7e; --accent-ink:#fff; --gold:#9a7424; --danger:#a33b4a; --ok:#2f7350;
  --fire:#b4502e; --water:#2b6a92; --air:#5f6684; --earth:#4f7630; --major:#9a7424;
  --moon-lit:#f3e9c8; --moon-dark:#2c2643;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#110f1d; --surface:#1b1830; --surface2:#262140; --text:#ece8f7; --muted:#a39cbd;
    --line:#332c52; --accent:#c6b4ff; --accent-ink:#1a1530; --gold:#e1bd68; --danger:#f08c98; --ok:#84d0a4;
    --fire:#ef9367; --water:#7cbde4; --air:#b5bbd8; --earth:#a4cf78; --major:#e1bd68;
    --moon-lit:#f6edcf; --moon-dark:#2a2545;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#110f1d; --surface:#1b1830; --surface2:#262140; --text:#ece8f7; --muted:#a39cbd;
  --line:#332c52; --accent:#c6b4ff; --accent-ink:#1a1530; --gold:#e1bd68; --danger:#f08c98; --ok:#84d0a4;
  --fire:#ef9367; --water:#7cbde4; --air:#b5bbd8; --earth:#a4cf78; --major:#e1bd68;
  --moon-lit:#f6edcf; --moon-dark:#2a2545;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,select,input,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0}
p{margin:.4em 0}
.muted{color:var(--muted)}
.small{font-size:.87rem}

header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 12px) 20px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
header.top h1{font-size:1.65rem;letter-spacing:.01em}
header.top .today{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:.95rem}
main{max-width:680px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:.72rem}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
.label{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:.98rem;margin-bottom:6px;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 16px;min-height:44px;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.ghost{background:none}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.9rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
input[type=text],input[type=search],input[type=date],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;min-height:44px}
textarea{resize:vertical;line-height:1.5}
.field{display:block;margin:14px 0}
.check{display:inline-flex;align-items:center;gap:8px;min-height:44px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px 4px;letter-spacing:-.01em;min-height:38px;font-size:.92rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.badge{display:inline-block;font-size:.76rem;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.ok{color:var(--ok);border-color:currentColor}
.badge.no{color:var(--danger);border-color:currentColor}
.badge.part{color:var(--gold);border-color:currentColor}
.badge.pend{color:var(--accent);border-color:currentColor}
.notice{border:1px dashed var(--gold);border-radius:14px;padding:12px 14px;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}

/* Altar: luna + carta del día */
.altar{position:relative;overflow:hidden;padding:22px 18px}
.altar .moonrow{display:flex;gap:18px;align-items:center}
.altar svg.moon{flex:none;filter:drop-shadow(0 0 18px color-mix(in srgb,var(--moon-lit) 35%,transparent))}
.altar h2{font-size:1.75rem}
.altar .signline{font-family:var(--serif);font-size:1.1rem;margin-top:2px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.kv div{background:var(--bg);border-radius:12px;padding:10px 12px}
.kv span{display:block;font-size:.8rem;color:var(--muted)}
.kv b{font-family:var(--serif);font-weight:600}
.suggest{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}

/* Cartas */
.tc{--w:88px;width:var(--w);aspect-ratio:7/12;border-radius:calc(var(--w)*.11);border:1.5px solid var(--gold);background:linear-gradient(170deg,var(--surface),var(--surface2));position:relative;flex:none;color:var(--c,var(--major));box-shadow:0 2px 8px rgba(20,10,40,.14)}
.tc .tci{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(var(--w)*.08) calc(var(--w)*.06);text-align:center;transition:transform .35s}
.tc.rev .tci{transform:rotate(180deg)}
.tc .tn{font-family:var(--serif);font-weight:600;font-size:calc(var(--w)*.16);line-height:1}
.tc .tg svg{width:calc(var(--w)*.48);height:calc(var(--w)*.48);stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.tc .tl{font-family:var(--serif);font-size:calc(var(--w)*.115);line-height:1.15;color:var(--text)}
.tc.s{--w:46px}.tc.s .tl{display:none}.tc.s .tci{justify-content:center;gap:2px}.tc.s .tn{font-size:12px}.tc.s .tg svg{width:20px;height:20px}
.tc.l{--w:132px}
.tc.fire{--c:var(--fire)}.tc.water{--c:var(--water)}.tc.air{--c:var(--air)}.tc.earth{--c:var(--earth)}.tc.major{--c:var(--major)}
.tc.back{background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--gold) 30%,transparent) 0 12%,transparent 13%),repeating-linear-gradient(45deg,var(--surface2) 0 6px,var(--surface) 6px 12px);color:var(--gold)}
.tc.back .tci{justify-content:center}
.tc.empty{border-style:dashed;background:var(--bg);box-shadow:none}
.tc.drawn{animation:reveal .45s ease-out}
@keyframes reveal{from{transform:rotateY(90deg) scale(.95);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.tc.drawn{animation:none}.tc .tci{transition:none}}
.cardbtn{background:none;border:0;padding:0}
.daily{display:flex;gap:16px;align-items:flex-start}
.daily h3{font-size:1.3rem;margin-bottom:4px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 2px;margin-top:6px}
.strip .d{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;color:var(--muted)}

/* Lecturas */
.ritem{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.ritem .rtop{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:.88rem;color:var(--muted)}
.ritem .rq{font-family:var(--serif);font-size:1.12rem;margin:6px 0 10px}
.ritem .rcards{display:flex;gap:6px;overflow:hidden}
.poscard{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.poscard:first-child{border-top:0}
.poscard .ptitle{font-family:var(--serif);font-size:1.05rem;margin-bottom:6px}
.poscard .meaning{font-size:.9rem;color:var(--muted);margin-top:6px}

/* Hoja */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet[hidden]{display:none}
.sheet .shead{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;border-bottom:1px solid var(--line)}
.sheet .shead h2{flex:1;text-align:center;font-size:1.15rem}
.sheet .sbody{max-width:680px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom,0px))}

/* Estudio y catálogo */
.flash{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:10px 0}
.flash h3{font-size:1.4rem}

const RAD=Math.PI/180;
const norm=a=>{a%=360;return a<0?a+360:a};
const julian=d=>d.getTime()/86400000+2440587.5;
function sunLon(T){
  const M=(357.52911+35999.05029*T)*RAD, L0=280.46646+36000.76983*T;
  const C=(1.914602-0.004817*T)*Math.sin(M)+(0.019993-0.000101*T)*Math.sin(2*M)+0.000289*Math.sin(3*M);
  return norm(L0+C-0.00569);
}
function moonLon(T){
  const Lp=218.3164477+481267.88123421*T, D=(297.8501921+445267.1114034*T)*RAD,
  M=(357.5291092+35999.0502909*T)*RAD, Mp=(134.9633964+477198.8675055*T)*RAD, F=(93.2720950+483202.0175233*T)*RAD;
  const s=Math.sin;
  return norm(Lp+6.288774*s(Mp)+1.274027*s(2*D-Mp)+0.658314*s(2*D)+0.213618*s(2*Mp)-0.185116*s(M)-0.114332*s(2*F)
   +0.058793*s(2*D-2*Mp)+0.057066*s(2*D-M-Mp)+0.053322*s(2*D+Mp)+0.045758*s(2*D-M)-0.040923*s(M-Mp)-0.034720*s(D)
   -0.030383*s(M+Mp)+0.015327*s(2*D-2*F)-0.012528*s(Mp+2*F)+0.010980*s(Mp-2*F)+0.010675*s(4*D-Mp)+0.010034*s(3*Mp)
   +0.008548*s(4*D-2*Mp)-0.007888*s(2*D+M-Mp)-0.006766*s(2*D+M)-0.005163*s(D-Mp)+0.004987*s(D+M)+0.004036*s(2*D-M+Mp));
}
function phaseOf(e){
  if(e<12||e>=348) return {key:"nueva",name:"Luna nueva",emoji:"🌑",group:"nueva"};
  if(e<78) return {key:"creciente",name:"Luna creciente",emoji:"🌒",group:"creciente"};
  if(e<102) return {key:"cuartoc",name:"Cuarto creciente",emoji:"🌓",group:"creciente"};
  if(e<168) return {key:"gibosac",name:"Gibosa creciente",emoji:"🌔",group:"creciente"};
  if(e<192) return {key:"llena",name:"Luna llena",emoji:"🌕",group:"llena"};
  if(e<258) return {key:"gibosam",name:"Gibosa menguante",emoji:"🌖",group:"menguante"};
  if(e<282) return {key:"cuartom",name:"Cuarto menguante",emoji:"🌗",group:"menguante"};
  return {key:"menguante",name:"Luna menguante",emoji:"🌘",group:"menguante"};
}
function moonInfo(date){
  const T=(julian(date)-2451545)/36525, ml=moonLon(T), sl=sunLon(T), e=norm(ml-sl);
  return {lon:ml,elong:e,illum:(1-Math.cos(e*RAD))/2,age:e/360*29.530589,sign:Math.floor(ml/30)%12,phase:phaseOf(e)};
}
function nextPhase(from,target){
  const f=t=>{const x=moonInfo(new Date(t)).elong-target;return ((x+540)%360)-180};
  let t=from.getTime(),step=6*3600e3,prev=f(t);
  for(let i=0;i<160;i++){
    const t2=t+step,v=f(t2);
    if(prev<0&&v>=0){let a=t,b=t2;for(let j=0;j<30;j++){const m=(a+b)/2;if(f(m)<0)a=m;else b=m}return new Date(b)}
    t=t2;prev=v;
  }
  return null;
}

function moonSVG(elong,size){
  const r=size/2-2,c=size/2,illum=(1-Math.cos(elong*RAD))/2,rx=r*Math.abs(1-2*illum),waxing=elong<180;
  const limb=waxing?1:0,term=waxing?(illum<.5?0:1):(illum<.5?1:0);
  const lit=illum<0.005?"":`<path d="M${c} ${c-r} A${r} ${r} 0 0 ${limb} ${c} ${c+r} A${rx} ${r} 0 0 ${term} ${c} ${c-r}Z" fill="var(--moon-lit)"/>`;
  return `<svg class="moon" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Luna ${Math.round(illum*100)}% iluminada"><circle cx="${c}" cy="${c}" r="${r}" fill="var(--moon-dark)" stroke="var(--line)"/>${illum>0.995?`<circle cx="${c}" cy="${c}" r="${r}" fill="var(--moon-lit)"/>`:lit}</svg>`;
}

function occurrences(id){
  const items=[];
  DB.readings.forEach(r=>r.cards.forEach(c=>{if(c.id===id)items.push({date:r.date,rev:c.rev,where:c.pos+" en “"+(r.question||readingSpreadName(r))+"”",rid:r.id,outcome:r.outcome||""})}));
  Object.entries(DB.daily).forEach(([k,d])=>{if(d.id===id)items.push({date:k,rev:d.rev,where:"Carta del día"})});
  return items.sort((a,b)=>b.date.localeCompare(a.date));
}
function recentCounts(days=30){
  const m={};const add=(id,k)=>{if(!id||daysAgo(k)>days||daysAgo(k)<0)return;(m[id]||(m[id]={n:0,dates:[]})).n++;m[id].dates.push(k)};
  DB.readings.forEach(r=>r.cards.forEach(c=>add(c.id,r.date)));
  Object.entries(DB.daily).forEach(([k,d])=>add(d.id,k));
  Object.values(m).forEach(v=>v.dates.sort().reverse());
  return m;
}
function pendingRepeats(){

const evCache={};
function monthEvents(y,m){
  const key=y+"-"+m;if(evCache[key])return evCache[key];
  const start=new Date(y,m,1),end=new Date(y,m+1,1),ev={};

  return evCache[key]=ev;
}

  if(cur.gone)h+=`<option value="${esc(draft.spread)}" selected>${esc(cur.name)}</option>`;

}

/* ---- Asistente de interpretación ---- */
const FRIEND={fuego:"aire",aire:"fuego",agua:"tierra",tierra:"agua"},OPP={fuego:"agua",agua:"fuego",aire:"tierra",tierra:"aire"};
function relation(a,b){
  if(!a||!b)return null;
  if(a===b)return ["refuerzo","Se refuerzan","mismo elemento: su energía se intensifica"];
  if(FRIEND[a]===b)return ["apoyo","Se apoyan","elementos afines que se ayudan"];
  if(OPP[a]===b)return ["tension","Tensión","elementos opuestos: se debilitan o piden integrar dos fuerzas"];
  return ["neutro","Neutras","elementos compatibles sin gran influencia entre sí"];
}
const EL_DOM={fuego:"el tema gira en torno a la acción, la pasión y la voluntad.",agua:"el tema es emocional: vínculos, sentimientos e intuición.",aire:"el tema es mental: pensamientos, conversaciones y decisiones.",tierra:"el tema es concreto: dinero, cuerpo, trabajo o el hogar."};
const EL_MISS={fuego:"quizá falta motivación, iniciativa o deseo.",agua:"las emociones podrían estar quedando fuera.",aire:"conviene pensar o conversar más el asunto.",tierra:"cuidado con que todo quede en ideas sin concretar."};

  const w=$("#assistWrap");if(!w)return;
  w.innerHTML=`<button class="btn block" data-act="toggleAssist" style="margin-top:14px">${st.assistOpen?"Ocultar asistente":"Asistente de interpretación"}</button>${st.assistOpen?`<div class="assist">${analyze(draft)}</div>`:""}`;

function analyze(r){
  const cs=r.cards.filter(c=>c.id).map(c=>Object.assign({},c,{card:CARD[c.id]}));
  if(!cs.length)return `<p class="muted">Saca o elige cartas para analizar la tirada.</p>`;
  const recent=recentCounts(30),tags=(r.tags||[]).map(t=>t.toLowerCase());
  const loveT=tags.some(t=>/amor|pareja|relaci/.test(t)),workT=tags.some(t=>/trabajo|dinero|carrera|estudio/.test(t));
  const m=moonForKey(r.date||dkey());let h="";
  h+=`<p class="small muted">Lectura en ${m.name.toLowerCase()}, con la luna en ${SIGNS[m.sign][0]}. Esto es una guía para ordenar tus ideas; la interpretación es tuya.</p>`;
  h+=`<h4>Carta por carta</h4>`;
  cs.forEach(c=>{
    const past=occurrences(c.id).filter(o=>o.rid&&o.rid!==r.id),rev=past.filter(o=>o.outcome),si=rev.filter(o=>o.outcome==="si").length,pa=rev.filter(o=>o.outcome==="parcial").length,no=rev.filter(o=>o.outcome==="no").length;
    const note=DB.notes[c.id];
    h+=`<div class="ablock"><b>${esc(c.pos)}:</b> ${esc(c.card.name)}${c.rev?" (invertida)":""}<p>${esc(meaning(c.id,c.rev))}.</p>`;
    if(loveT)h+=`<p class="small">En el amor: ${esc(c.card.amor)}</p>`;
    if(workT)h+=`<p class="small">En el trabajo: ${esc(c.card.trab)}</p>`;
    if(/consejo|paso|mensaje/i.test(c.pos))h+=`<p class="small">Como consejo: ${esc(c.card.cons)}</p>`;
    if(note)h+=`<p class="small muted">Tu nota: ${esc(trunc(note,160))}</p>`;
    if(past.length)h+=`<p class="small muted">Salió en ${past.length} ${past.length===1?"lectura anterior":"lecturas anteriores"}${rev.length?`; de las revisadas, ${si} se cumplieron, ${pa} en parte y ${no} no`:""}.</p>`;
    if(recent[c.id]&&recent[c.id].n>=3)h+=`<p class="small muted">Te ha salido ${recent[c.id].n} veces en los últimos 30 días.</p>`;
    h+=`</div>`;
  });
  const ins=[],n=cs.length;
  const maj=cs.filter(c=>c.card.arc==="mayor").length,revs=cs.filter(c=>c.rev).length,courts=cs.filter(c=>c.card.court);
  if(n>=3&&maj/n>=.5)ins.push("Muchos arcanos mayores: la situación tiene un peso importante en tu vida y hay fuerzas más grandes que las decisiones del día a día.");
  else if(n>=3&&maj===0)ins.push("Sin arcanos mayores: es un asunto cotidiano que está bastante en tus manos.");
  if(n>=2&&revs/n>=.5)ins.push("Muchas cartas invertidas: energía bloqueada, retrasada o que se vive hacia adentro.");
  if(courts.length>=2)ins.push(`Hay ${courts.length} figuras de la corte: puede haber otras personas involucradas, o distintas partes de ti en juego.`);
  const ec={fuego:0,agua:0,aire:0,tierra:0};cs.forEach(c=>{if(c.card.elem)ec[c.card.elem]++});
  const tot=Object.values(ec).reduce((a,b)=>a+b,0);
  if(tot){
    ins.push("Elementos: "+Object.entries(ec).map(([k,v])=>EL[k]+" "+v).join(", ")+(maj?" (los arcanos regidos por un planeta no suman elemento).":"."));
    const dom=Object.entries(ec).sort((a,b)=>b[1]-a[1])[0];
    if(tot>=2&&dom[1]/tot>=.5&&dom[1]>=2)ins.push(`Predomina ${({fuego:"el fuego",tierra:"la tierra",aire:"el aire",agua:"el agua"})[dom[0]]}: ${EL_DOM[dom[0]]}`);
    if(n>=4)Object.entries(ec).forEach(([k,v])=>{if(!v)ins.push(`Falta ${({fuego:"fuego",tierra:"tierra",aire:"aire",agua:"agua"})[k]}: ${EL_MISS[k]}`)});
  }
  const ranks={};cs.forEach(c=>{if(c.card.arc==="menor"){const rr=+c.id.slice(1);(ranks[rr]||(ranks[rr]=[])).push(c)}});
  Object.entries(ranks).forEach(([rr,arr])=>{if(arr.length>=2){rr=+rr;ins.push(rr<=10?`Se repite el número ${rr} (${arr.length} veces): ${NUM_TXT[rr]}.`:`Se repiten ${arr.length} ${["sotas","caballeros","reinas","reyes"][rr-11]}: ${COURT_TXT[rr-11]}`)}});
  h+=`<h4>Panorama de la tirada</h4>${ins.map(t=>`<p>${esc(t)}</p>`).join("")||'<p class="muted small">Sin patrones destacados.</p>'}`;
  if(n>=2){
    h+=`<h4>Cartas vecinas</h4><p class="small muted">Según sus elementos, en el orden de la tirada.</p>`;
    for(let i=0;i<n-1;i++){
      const a=cs[i],b=cs[i+1],rel=relation(a.card.elem,b.card.elem),cb=DB.combos[comboKey(a.id,b.id)];
      h+=`<div class="pair"><div class="row" style="gap:6px">${face(a.id,a.rev,"s")}${face(b.id,b.rev,"s")}<div style="flex:1;min-width:150px"><b>${esc(a.card.name)} y ${esc(b.card.name)}</b><p class="small">${rel?`${rel[1]}: ${rel[2]}.`:"Una de ellas está regida por un planeta: lee su relación por el significado."}</p></div></div>
      ${cb&&cb.note?`<p class="small">Tu combinación: ${esc(cb.note)}</p>`:""}<button class="btn ghost sm" data-act="comboOpen" data-a="${a.id}" data-b="${b.id}">${cb?"Editar combinación":"Anotar combinación"}</button></div>`;
    }
    const others=[];
    for(let i=0;i<n;i++)for(let j=i+2;j<n;j++){const cb=DB.combos[comboKey(cs[i].id,cs[j].id)];if(cb&&cb.note)others.push([cs[i],cs[j],cb])}
    if(others.length)h+=`<h4>Otras combinaciones tuyas en esta tirada</h4>${others.map(([a,b,cb])=>`<p class="small"><b>${esc(a.card.name)} y ${esc(b.card.name)}:</b> ${esc(cb.note)}</p>`).join("")}`;
  }
  return h;
}

const groupCards=g=>g==="todas"?CARDS:CARDS.filter(c=>c.suit===g);
const mastered=id=>{const s=DB.study[id];return s&&s.ok>=2&&s.ok-s.fail>=2};
function pickStudy(){
  const pool=groupCards(st.studyGroup).filter(c=>c.id!==st.studyCur);
  const w=pool.map(c=>{const s=DB.study[c.id]||{ok:0,fail:0};return Math.max(.25,1+s.fail*1.5-s.ok*.5)});
  let r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<pool.length;i++){r-=w[i];if(r<=0)return pool[i].id}
  return pool[pool.length-1].id;
}
function markStudy(id,ok){const s=DB.study[id]||(DB.study[id]={ok:0,fail:0});s[ok?"ok":"fail"]++;st.sess.total++;if(ok)st.sess.ok++;save()}

   ${body}</section>`;

function studySignificado(){
  if(!st.studyCur||!groupCards(st.studyGroup).some(c=>c.id===st.studyCur)){st.studyCur=pickStudy();st.studyShown=false}
  const c=CARD[st.studyCur],note=DB.notes[c.id];

function newQuiz(){
  const mode=st.studyMode,id=pickStudy();st.studyCur=id;const c=CARD[id];const q={mode,id,picked:null};
  if(mode==="adivina"){
    let pool=groupCards(st.studyGroup);if(pool.length<4)pool=CARDS;
    q.prompt="¿Qué carta tiene este significado?";q.quote=c.up;
    q.options=shuffled([id,...shuffled(pool.filter(x=>x.id!==id)).slice(0,3).map(x=>x.id)]).map(v=>[v,CARD[v].name]);q.answer=id;
  }else if(mode==="orientacion"){
    const rev=rnd(2)===1;q.prompt=`¿Esto describe ${c.name} al derecho o invertida?`;q.quote=rev?c.rev:c.up;q.options=[["up","Al derecho"],["rev","Invertida"]];q.answer=rev?"rev":"up";q.showFace=true;
  }else{
    const kinds=[];if(c.elem)kinds.push("el");if(c.astro)kinds.push("astro");if(c.heb)kinds.push("heb");
    const k=kinds[rnd(kinds.length)];q.showFace=true;
    if(k==="el"){q.prompt=`¿Qué elemento corresponde a ${c.name}?`;q.options=Object.entries(EL);q.answer=c.elem}
    if(k==="astro"){const pool=[...new Set(CARDS.filter(x=>x.arc===c.arc&&x.astro&&x.astro!==c.astro).map(x=>x.astro))];q.prompt=`¿Qué correspondencia astrológica tiene ${c.name}?`;q.options=shuffled([c.astro,...shuffled(pool).slice(0,3)]).map(v=>[v,v]);q.answer=c.astro}
    if(k==="heb"){q.prompt=`¿Qué letra hebrea corresponde a ${c.name}?`;q.options=shuffled([c.heb,...shuffled(HEB.filter(x=>x[0]!==c.heb[0])).slice(0,3)]).map(x=>[x[0],`${x[0]} ${x[1]}`]);q.answer=c.heb[0]}
  }
  st.q=q;
}
function studyQuiz(){
  if(!st.q||st.q.mode!==st.studyMode||!groupCards(st.studyGroup).some(c=>c.id===st.q.id))newQuiz();
  const q=st.q,c=CARD[q.id],done=q.picked!==null,ok=q.picked===q.answer;
  return `<div class="flash">${q.showFace||done?face(c.id,false,"l"):backFace("l")}<h3 style="font-size:1.15rem">${esc(q.prompt)}</h3>${q.quote?`<p class="quote">“${esc(q.quote)}”</p>`:""}

   ${done?`<p class="${ok?"good":"bad"}">${ok?"¡Correcto!":"No era esa."} ${esc(c.name)}: ${esc(c.up)}.</p><button class="btn primary block" data-act="nextQ">Siguiente</button>`:""}</div>`;

function corrInText(text){
  const t=(text||"").toLowerCase();if(!t)return[];
  const cands=allCorr().filter(c=>c.cat!=="dia"&&c.cat!=="fase"&&c.cat!=="elemento").map(c=>[c,c.name.toLowerCase().split(" o ")[0]]).sort((a,b)=>b[1].length-a[1].length);
  const used=[],out=[];
  const isWord=ch=>/[a-záéíóúüñ]/i.test(ch||"");
  cands.forEach(([c,n])=>{let i=t.indexOf(n);while(i>=0){const e=i+n.length;
    if(!isWord(t[i-1])&&!isWord(t[e])&&!used.some(([a,b])=>i<b&&e>a)){used.push([i,e]);if(!out.includes(c))out.push(c)}
    i=t.indexOf(n,i+1)}});
  return out;
}
/* ---- Ciclos lunares ---- */
function prevNewMoon(date){
  let d=nextPhase(new Date(date.getTime()-32*864e5),0);
  for(let i=0;i<3;i++){const n=nextPhase(new Date(d.getTime()+864e5),0);if(!n||n>date)return d;d=n}
  return d;
}
const cycCache={};
function cycleOf(date=new Date()){
  const start=prevNewMoon(date),k=dkey(start);if(cycCache[k])return cycCache[k];
  const full=nextPhase(new Date(start.getTime()+864e5),180),end=nextPhase(new Date(start.getTime()+864e5),0);
  return cycCache[k]={key:k,start,full,end,startK:k,fullK:dkey(full),endK:dkey(end)};
}

/* ---- Rituales: fechas ideales ---- */
const hasConditions=r=>!!(r.phase||r.sign!==""&&r.sign!=null||r.weekday!==""&&r.weekday!=null);
function matchesDay(r,d){
  if(r.weekday!==""&&r.weekday!=null&&d.getDay()!==+r.weekday)return false;
  if(!r.phase&&(r.sign===""||r.sign==null))return true;
  const mi=moonInfo(d);
  if(r.phase&&mi.phase.group!==r.phase)return false;
  if(r.sign!==""&&r.sign!=null&&mi.sign!==+r.sign)return false;
  return true;
}
function nextIdeal(r,from=new Date()){
  if(!hasConditions(r))return null;
  for(let i=0;i<420;i++){const d=new Date(from.getFullYear(),from.getMonth(),from.getDate()+i,i?12:from.getHours(),i?0:from.getMinutes());if(matchesDay(r,d))return dkey(d)}
  return null;
}
function conditionsText(r){
  const p=[];if(r.phase)p.push(PHASE_IDEAL.find(x=>x[0]===r.phase)[1].toLowerCase());
  if(r.sign!==""&&r.sign!=null)p.push("luna en "+SIGNS[+r.sign][0]);
  if(r.weekday!==""&&r.weekday!=null)p.push(WEEKDAYS[+r.weekday].split(" ")[0].toLowerCase());
  return p.join(", ");
}

 marte:[1.52371034,0.00001847,0.09339410,0.00007882,1.84969142,-0.00813131,-4.55343205,19140.30268499,-23.94362959,0.44441088,49.55953891,-0.29257343],

 saturno:[9.53667594,-0.00125060,0.05386179,-0.00050991,2.48599187,0.00193609,49.95424423,1222.49362201,92.59887831,-0.41897216,113.66242448,-0.28867794],
 urano:[19.18916464,-0.00196176,0.04725744,-0.00004397,0.77263783,-0.00242939,313.23810451,428.48202785,170.95427630,0.40805281,74.01692503,0.04240589],
 neptuno:[30.06992276,0.00026291,0.00859048,0.00005105,1.77004347,0.00035372,-55.12002969,218.45945325,44.96476227,-0.32241464,131.78422574,-0.00508664],
 pluton:[39.48211675,-0.00031596,0.24882730,0.00005170,17.14001206,0.00004818,238.92903833,145.20780515,224.06891629,-0.04062942,110.30393684,-0.01183482]
};
function helio(k,T){
  const o=ORB[k],a=o[0]+o[1]*T,e=o[2]+o[3]*T,I=(o[4]+o[5]*T)*RAD,L=o[6]+o[7]*T,w=o[8]+o[9]*T,N=o[10]+o[11]*T;
  const M=norm(L-w)*RAD,om=(w-N)*RAD,Om=N*RAD;
  let E=M+e*Math.sin(M);for(let i=0;i<8;i++)E=E-(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));
  const xp=a*(Math.cos(E)-e),yp=a*Math.sqrt(1-e*e)*Math.sin(E);
  const co=Math.cos(om),so=Math.sin(om),cO=Math.cos(Om),sO=Math.sin(Om),cI=Math.cos(I),sI=Math.sin(I);
  return [(co*cO-so*sO*cI)*xp+(-so*cO-co*sO*cI)*yp,(co*sO+so*cO*cI)*xp+(-so*sO+co*cO*cI)*yp,(so*sI)*xp+(co*sI)*yp];
}
const PREC=1.396971; // precesión general en longitud, grados por siglo
function planetLon(k,date){
  const T=(julian(date)-2451545)/36525;
  if(k==="sol")return sunLon(T);
  if(k==="luna")return moonLon(T);
  if(k==="nodo")return norm(125.04452-1934.136261*T);
  const p=helio(k,T),e=helio("tierra",T);
  return norm(Math.atan2(p[1]-e[1],p[0]-e[0])/RAD+PREC*T);
}
function planetSpeed(k,date){const d=6*3600e3;let x=planetLon(k,new Date(date.getTime()+d))-planetLon(k,new Date(date.getTime()-d));if(x>180)x-=360;if(x<-180)x+=360;return x*2}
const PLANETS=[["sol","Sol","☉"],["luna","Luna","☽"],["mercurio","Mercurio","☿"],["venus","Venus","♀"],["marte","Marte","♂"],["jupiter","Júpiter","♃"],["saturno","Saturno","♄"],["urano","Urano","♅"],["neptuno","Neptuno","♆"],["pluton","Plutón","♇"],["nodo","Nodo norte","☊"]];
const PL=Object.fromEntries(PLANETS.map(p=>[p[0],{key:p[0],name:p[1],g:p[2]+"\uFE0E"}]));

const sgn=l=>Math.floor(norm(l)/30);
function fmtLon(l){l=norm(l);const s=Math.floor(l/30),d=l-s*30,deg=Math.floor(d),min=Math.floor((d-deg)*60);return `${deg}°${pad(min)}′ ${SIGNS[s][0]}`}
const fmtLonShort=l=>{l=norm(l);return `${Math.floor(l%30)}° ${SIGNS[sgn(l)][0]}`};

/* Ascendente, medio cielo y casas */
function angles(date,lat,lon){
  const JD=julian(date),T=(JD-2451545)/36525;
  const gmst=norm(280.46061837+360.98564736629*(JD-2451545)+0.000387933*T*T);
  const ramc=norm(gmst+lon),eps=(23.4392911-0.0130042*T)*RAD,r=ramc*RAD,f=lat*RAD;
  const mc=norm(Math.atan2(Math.sin(r),Math.cos(r)*Math.cos(eps))/RAD);
  const asc=norm(Math.atan2(Math.cos(r),-(Math.sin(r)*Math.cos(eps)+Math.tan(f)*Math.sin(eps)))/RAD);
  return {ramc,eps,mc,asc};
}
function placidus(ang,lat){
  const {ramc,eps,mc,asc}=ang,f=lat*RAD;
  const lamOfRA=a=>norm(Math.atan2(Math.sin(a*RAD),Math.cos(a*RAD)*Math.cos(eps))/RAD);
  const decOf=l=>Math.asin(Math.sin(l*RAD)*Math.sin(eps));
  const cusp=(frac,below)=>{
    let l=lamOfRA(below?ramc+180-90*frac:ramc+90*frac);
    for(let i=0;i<30;i++){
      const x=-Math.tan(f)*Math.tan(decOf(l));if(Math.abs(x)>1)return NaN;
      const sda=Math.acos(x)/RAD,sna=180-sda;
      const ra=below?ramc+180-sna*frac:ramc+sda*frac;
      const nl=lamOfRA(ra);if(Math.abs(nl-l)<1e-6){l=nl;break}l=nl;
    }
    return l;
  };
  const c11=cusp(1/3,false),c12=cusp(2/3,false),c2=cusp(2/3,true),c3=cusp(1/3,true);
  if([c11,c12,c2,c3].some(isNaN))return null;
  const c=[asc,c2,c3,norm(mc+180),norm(c11+180),norm(c12+180),norm(asc+180),norm(c2+180),norm(c3+180),mc,c11,c12];
  return c;
}
function houseCusps(sys,ang,lat){

const stCache={};
function monthSky(y,m){
  const key=y+"-"+m;if(stCache[key])return stCache[key];
  const days=new Date(y,m+1,0).getDate(),out={};
  const add=(k,o)=>(out[k]||(out[k]=[])).push(o);
  const at=(d)=>new Date(y,m,d,0,0);
  for(let d=1;d<=days;d++){
    const t0=at(d),t1=at(d+1),k=dkey(t0);
    RETRO_PL.forEach(p=>{
      const s0=planetSpeed(p,t0),s1=planetSpeed(p,t1);
      if(s0>=0&&s1<0)add(k,{type:"rx",p,text:`${PL[p].name} se pone retrógrado`});
      if(s0<0&&s1>=0)add(k,{type:"dx",p,text:`${PL[p].name} retoma su marcha directa`});
    });
    PLANETS.forEach(([p])=>{
      if(p==="nodo")return;
      const a=sgn(planetLon(p,t0)),b=sgn(planetLon(p,t1));
      if(a!==b){let lo=t0.getTime(),hi=t1.getTime();for(let i=0;i<25;i++){const mid=(lo+hi)/2;sgn(planetLon(p,new Date(mid)))===a?lo=mid:hi=mid}
        add(k,{type:"in",p,time:new Date(hi),text:`${PL[p].name} entra en ${SIGNS[b][0]}`})}
    });
  }
  return stCache[key]=out;
}

function nextStations(from,days=120){
  const out=[];let t=new Date(from.getFullYear(),from.getMonth(),from.getDate());
  const sp={};RETRO_PL.forEach(p=>sp[p]=planetSpeed(p,t));
  for(let i=1;i<=days;i++){const t1=new Date(t.getFullYear(),t.getMonth(),t.getDate()+1);
    RETRO_PL.forEach(p=>{const s=planetSpeed(p,t1);if(sp[p]>=0&&s<0)out.push({p,type:"rx",k:dkey(t1)});if(sp[p]<0&&s>=0)out.push({p,type:"dx",k:dkey(t1)});sp[p]=s});t=t1}
  return out;
}
function nextReturn(p,target,from){
  // siguiente momento en que el planeta vuelve a la longitud indicada
  const step=p==="luna"?3*3600e3:24*3600e3,max=p==="luna"?40:400;
  const f=t=>{let x=planetLon(p,new Date(t))-target;return ((x+540)%360)-180};
  let t=from.getTime(),prev=f(t);
  for(let i=0;i<max*(p==="luna"?8:1);i++){const t2=t+step,v=f(t2);if(prev<0&&v>=0&&v-prev<90){let a=t,b=t2;for(let j=0;j<40;j++){const m=(a+b)/2;f(m)<0?a=m:b=m}return new Date(b)}t=t2;prev=v}
  return null;
}

const RELATIONS=[["pareja","Pareja"],["amistad","Amistad"],["familia","Familia"],["trabajo","Trabajo"],["otro","Otro"]];
const REL_INTRO={pareja:"Como pareja, fíjate sobre todo en los contactos de Venus, Marte, el Sol y la Luna.",amistad:"En una amistad pesan mucho Mercurio (cómo conversan), la Luna (cómo se cuidan) y Júpiter (qué comparten).",familia:"En la familia destacan la Luna y Saturno: el cuidado, las raíces y los roles que cada quien asume.",trabajo:"En el trabajo importan Mercurio, Marte y Saturno: cómo se comunican, cómo actúan y qué responsabilidades comparten.",otro:""};

const GENERATIONAL=["urano","neptuno","pluton"];
function chartPoints(ch,R){const pts=R.planets.filter(p=>!NON_ASPECT.includes(p.key)&&!(ch.noTime&&p.key==="luna")).map(p=>({k:p.key,l:p.lon}));if(R.ang)pts.push({k:"asc",l:R.ang.asc},{k:"mc",l:R.ang.mc});return pts}
function synastry(me,other){
  const A=computeChart(me),B=computeChart(other),pa=chartPoints(me,A),pb=chartPoints(other,B),asp=[];
  pa.forEach(x=>pb.forEach(y=>{
    if(GENERATIONAL.includes(x.k)&&GENERATIONAL.includes(y.k))return;
    if((x.k==="asc"||x.k==="mc")&&(y.k==="asc"||y.k==="mc")&&x.k!==y.k)return;
    const lum=["sol","luna"].includes(x.k)||["sol","luna"].includes(y.k);
    const a=aspectBetween(x.l,y.l,lum?-2:-3);if(a)asp.push(Object.assign({mine:x.k,their:y.k,classic:classicKey(x.k,y.k)},a));

  const inMine=A.cusps?B.planets.filter(p=>!NON_ASPECT.includes(p.key)&&!(other.noTime&&p.key==="luna")).map(p=>({k:p.key,h:houseOf(p.lon,A.cusps)})):null;
  const inTheirs=B.cusps?A.planets.filter(p=>!NON_ASPECT.includes(p.key)&&!(me.noTime&&p.key==="luna")).map(p=>({k:p.key,h:houseOf(p.lon,B.cusps)})):null;

function biwheelSVG(S,me,o){

  return g+`</svg>`;
}

function searchResults(){
  const q=st.gq.trim().toLowerCase();if(q.length<2)return `<p class="muted small">Escribe al menos dos letras. Busca en lecturas, cartas, notas, rituales, tradiciones, intenciones, correspondencias, combinaciones, cartas natales y el glosario.</p>`;
  const has=(...xs)=>xs.join(" ").toLowerCase().includes(q),groups=[];
  const add=(title,items,fn)=>{if(items.length)groups.push(`<h3 class="grouph">${title} <span class="muted small">(${items.length})</span></h3>${items.slice(0,6).map(fn).join("")}${items.length>6?`<p class="small muted">y ${items.length-6} más…</p>`:""}`)};
  add("Lecturas",DB.readings.filter(r=>has(r.deck?DECKS[r.deck]:"",r.question,r.interp,r.followup,readingSpreadName(r),(r.tags||[]).join(" "),r.cards.map(c=>CARD[c.id]?.name).join(" "))).sort((a,b)=>b.date.localeCompare(a.date)),r=>`<button class="ritem compact" data-act="openReading" data-id="${r.id}"><div class="rtop"><span>${fmtDate(r.date)}</span></div><div class="rq">${esc(r.question||readingSpreadName(r))}</div></button>`);
  add("Cartas",CARDS.filter(c=>has(c.name,c.up,c.rev,c.sym,c.col,c.astro,DB.notes[c.id])),c=>`<button class="ritem compact" data-act="cardInfo" data-id="${c.id}"><div class="row" style="flex-wrap:nowrap">${face(c.id,false,"s")}<div><div class="rq" style="margin:0">${esc(c.name)}</div><div class="small muted">${esc(trunc(c.up,70))}</div></div></div></button>`);
  add("Cartas del día",Object.entries(DB.daily).filter(([k,d])=>has(d.note,CARD[d.id].name)).sort((a,b)=>b[0].localeCompare(a[0])),([k,d])=>`<button class="ritem compact" data-act="goDay" data-k="${k}"><div class="rtop"><span>${fmtDate(k)}</span></div><div class="rq">${esc(CARD[d.id].name)}</div>${d.note?`<div class="small muted">${esc(trunc(d.note,90))}</div>`:""}</button>`);
  add("Rituales",DB.rituals.filter(r=>has(r.title,r.type,r.purpose,r.ingredients,r.steps,r.notes,(r.logs||[]).map(l=>l.notes+" "+l.followup).join(" "))),r=>`<button class="ritem compact" data-act="ritualOpen" data-id="${r.id}"><div class="rtop"><span>${esc(r.type)}</span></div><div class="rq">${esc(r.title)}</div></button>`);
  add("Intenciones",DB.intentions.filter(x=>has(x.text,x.plan,x.fullNote,x.closeNote)),intentItem);
  add("Correspondencias",allCorr().filter(c=>has(c.name,c.txt,c.uses.join(" "),DB.corrNotes[c.id])),c=>`<button class="ritem compact" data-act="corrOpen" data-id="${c.id}"><div class="rq" style="margin:0">${esc(c.name)}</div><div class="small muted">${CORR_CATS[c.cat]}</div></button>`);
  add("Combinaciones",Object.values(DB.combos).filter(c=>has(CARD[c.a].name,CARD[c.b].name,c.note)),c=>`<button class="ritem compact" data-act="comboOpen" data-a="${c.a}" data-b="${c.b}"><div class="rq" style="margin:0">${esc(CARD[c.a].name)} y ${esc(CARD[c.b].name)}</div><div class="small muted">${esc(trunc(c.note||"",80))}</div></button>`);
  add("Glosario",GLO.filter(x=>has(x.t,x.s,x.b.join(" "))),x=>`<button class="ritem compact" data-act="gloOpen" data-id="${x.id}"><div class="rq" style="margin:0">${x.g?glyphOf(x)+" ":""}${esc(x.t)}</div><div class="small muted">${esc(x.s)}</div></button>`);
  add("Tradiciones",TRADITIONS.filter(r=>has(r.t,r.type,r.origin,r.src,r.mat.join(" "),r.steps.join(" "))),r=>`<button class="ritem compact" data-act="tradOpen" data-id="${r.id}"><div class="rq" style="margin:0">${esc(r.t)}</div><div class="small muted">${esc(r.origin)}</div></button>`);
  add("Cartas natales",DB.charts.filter(c=>has(c.name,c.place,c.bondNote)),c=>`<button class="ritem compact" data-act="goChart" data-id="${c.id}"><div class="rq" style="margin:0">${esc(c.name)}${c.mine?" (mi carta)":""}</div><div class="small muted">${fmtDate(c.date)}, ${esc(c.place||"")}</div></button>`);
  return groups.join("")||`<p class="muted">No encontré nada con “${esc(st.gq)}”.</p>`;

/* ============ Gestos: deslizar entre pestañas ============ */
const SWIPE_TABS={lecturas:["lecTab",["lista","calendario"]],cartas:["cardsTab",["estudiar","catalogo","combos"]],grimorio:["grimTab",["rituales","intenciones","corresp"]],astro:["astroTab",["carta","transitos","vinculos","cielo"]],glosario:["gloMode",["leer","estudiar"]]};
(function(){
  let sx=0,sy=0,t0=0,tgt=null;
  const main=document.getElementById("main");
  main.addEventListener("touchstart",e=>{if(e.touches.length!==1)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;t0=Date.now();tgt=e.target},{passive:true});
  main.addEventListener("touchend",e=>{
    if(!tgt)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy,el=tgt;tgt=null;
    if(Date.now()-t0>700||Math.abs(dx)<70||Math.abs(dy)>Math.abs(dx)*.5)return;
    if(el.closest(".chips.scroll,.strip,input,textarea,select,.wheel,.ptable"))return;
    if(el.closest(".cal")&&st.view==="lecturas"&&st.lecTab==="calendario"){ACT.calNav({dataset:{d:dx<0?"1":"-1"}});return}
    if(el.closest(".cal")&&st.view==="grimorio"&&st.ritMode==="cal"){ACT.rcNav({dataset:{d:dx<0?"1":"-1"}});return}
    if(el.closest(".spcanvas"))return;
    const cfg=SWIPE_TABS[st.view];if(!cfg)return;if(st.view==="astro"&&!DB.charts.length)return;
    const [key,tabs]=cfg,i=tabs.indexOf(st[key]),j=i+(dx<0?1:-1);if(j<0||j>=tabs.length)return;
    st[key]=tabs[j];render();
  },{passive:true});
  const pop=document.getElementById("pop");let py=0,dragging=false;
  pop.addEventListener("touchstart",e=>{const pn=e.target.closest(".pop-panel");if(!pn||pn.scrollTop>0)return;py=e.touches[0].clientY;dragging=true},{passive:true});
  pop.addEventListener("touchmove",e=>{if(!dragging)return;const d=e.touches[0].clientY-py,pn=pop.querySelector(".pop-panel");if(d>0&&pn)pn.style.transform=`translateY(${d}px)`},{passive:true});
  pop.addEventListener("touchend",e=>{if(!dragging)return;dragging=false;const d=e.changedTouches[0].clientY-py,pn=pop.querySelector(".pop-panel");if(pn)pn.style.transform="";if(d>90)closePop()},{passive:true});
})();

const TRAD_AGE={antigua:["Tradición antigua","ok"],clasica:["Magia clásica","pend"],popular:["Tradición popular","part"],moderna:["Práctica moderna",""]};
function renderTraditions(){
  const q=st.tradSearch.trim().toLowerCase();
  let list=TRADITIONS;if(q)list=list.filter(r=>[r.t,r.type,r.origin,r.src,r.mat.join(" "),r.steps.join(" ")].join(" ").toLowerCase().includes(q));
  return `<input type="search" placeholder="Buscar tradición, origen o ingrediente" data-bind="tradSearch" value="${esc(st.tradSearch)}">
  <p class="small muted">Rituales de tradiciones documentadas, con su origen y lo que necesita cada uno. Puedes copiarlos a tus rituales para adaptarlos y registrar cuándo los haces.</p>
  <div id="tradList">${tradList(list)}</div>`;
}
const tradList=list=>list.map(r=>{const a=TRAD_AGE[r.age];return `<button class="ritem" data-act="tradOpen" data-id="${r.id}"><div class="rtop"><span>${esc(r.type)}</span><span class="badge ${a[1]}">${a[0]}</span></div><div class="rq">${esc(r.t)}</div><div class="small muted">${esc(r.origin)}</div></button>`}).join("")||`<div class="empty">Ninguna tradición coincide.</div>`;
function tradSheet(id){
  const r=TRADITIONS.find(x=>x.id===id),a=TRAD_AGE[r.age],found=corrInText(r.mat.join(", "));
  return sheetHead(r.t)+`<div class="sbody">
   <div class="row" style="gap:8px;margin-bottom:6px"><span class="badge ${a[1]}">${a[0]}</span><span class="badge">${esc(r.type)}</span></div>
   <p class="muted" style="margin-top:4px">${esc(r.origin)}</p>
   <section class="panel"><span class="label">Fuente y contexto</span><p>${esc(r.src)}</p></section>
   <section class="panel"><span class="label">Cuándo hacerlo</span><p>${esc(r.when)}</p>
    <span class="label">Qué necesitas</span><ul class="mat">${r.mat.map(m=>`<li>${esc(m)}</li>`).join("")}</ul>${corrChips(found)}</section>
   <section class="panel"><span class="label">Cómo se hace</span><ol class="steps">${r.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></section>
   ${r.notes?`<section class="panel"><span class="label">Notas y precauciones</span><p>${esc(r.notes)}</p></section>`:""}
   <button class="btn primary block" data-act="tradCopy" data-id="${r.id}">Copiar a mis rituales</button>
   <p class="small muted">Las fuentes se citan de memoria y conviene verificarlas. Los pasos están resumidos con palabras propias.</p></div>`;
}

[

 [["Símbolo","Un círculo con un punto en el centro: el espíritu (el círculo) con su chispa individual (el punto)."],["Rige","Leo"],["Exaltación","Aries"],["Exilio","Acuario"],["Caída","Libra"],["Ritmo","Recorre el zodiaco en un año, unos 30 días por signo. Nunca está retrógrado."],["En el tarot","El Sol (XIX)"]]],
["luna","Luna","☽","Tus emociones, tus necesidades y lo que te da seguridad.",

 [["Símbolo","Una luna creciente: lo receptivo, el alma que refleja la luz del Sol."],["Rige","Cáncer"],["Exaltación","Tauro"],["Exilio","Capricornio"],["Caída","Escorpio"],["Ritmo","Da la vuelta al zodiaco en unos 27 días y medio: pasa de 2 a 3 días en cada signo. Nunca está retrógrada."],["En el tarot","La Sacerdotisa (II)"]]],
["mercurio","Mercurio","☿","La mente, la palabra y el aprendizaje.",
 ["Mercurio es el mensajero: representa cómo piensas, aprendes, hablas, escribes y procesas la información. También rige el comercio, los trámites, los viajes cortos, los hermanos y el entorno cercano.","Su signo describe tu estilo mental: rápido o pausado, lógico o intuitivo, directo o diplomático. Su casa muestra en qué temas se concentra tu mente.","Es famoso por sus periodos retrógrados, asociados a malentendidos, retrasos y fallos técnicos, y también a revisar, repasar y retomar."],
 [["Símbolo","El círculo del espíritu sobre la cruz de la materia, coronado por una media luna: la mente que conecta mundos."],["Rige","Géminis y Virgo"],["Exaltación","Virgo"],["Exilio","Sagitario y Piscis"],["Caída","Piscis"],["Ritmo","Nunca se aleja más de 28° del Sol. Pasa de 2 a 9 semanas por signo y se pone retrógrado unas tres veces al año, unas tres semanas cada vez."],["En el tarot","El Mago (I)"]]],
["venus","Venus","♀","El amor, el placer, la belleza y lo que valoras.",

 [["Símbolo","Un círculo sobre una cruz: el espíritu por encima de la materia. Es también el símbolo de lo femenino."],["Rige","Tauro y Libra"],["Exaltación","Piscis"],["Exilio","Escorpio y Aries"],["Caída","Virgo"],["Ritmo","Nunca se aleja más de unos 47° del Sol. Suele pasar unas 4 semanas por signo y se pone retrógrada cada 18 meses durante unas seis semanas."],["En el tarot","La Emperatriz (III)"]]],
["marte","Marte","♂","La acción, el deseo y la valentía.",

 [["Símbolo","Un círculo con una flecha que sale hacia arriba a la derecha: la energía disparada hacia un objetivo. Es también el símbolo de lo masculino."],["Rige","Aries y, en la astrología tradicional, Escorpio"],["Exaltación","Capricornio"],["Exilio","Libra y Tauro"],["Caída","Cáncer"],["Ritmo","Unas 6 semanas por signo. Cada dos años aproximadamente se pone retrógrado unos dos meses y medio, y entonces puede pasar hasta seis meses en un mismo signo."],["En el tarot","La Torre (XVI)"]]],
["jupiter","Júpiter","♃","La expansión, la fe y la buena fortuna.",

 [["Símbolo","Una media luna (el alma) sobre una cruz (la materia): la conciencia que se expande sobre lo material."],["Rige","Sagitario y, en la astrología tradicional, Piscis"],["Exaltación","Cáncer"],["Exilio","Géminis y Virgo"],["Caída","Capricornio"],["Ritmo","Unos 12 años para recorrer el zodiaco, casi un año por signo. Está retrógrado unos cuatro meses cada año."],["En el tarot","La Rueda de la Fortuna (X)"]]],

 [["Símbolo","La cruz de la materia sobre la media luna del alma, con forma de hoz: el tiempo y la realidad que dan forma."],["Rige","Capricornio y, en la astrología tradicional, Acuario"],["Exaltación","Libra"],["Exilio","Cáncer y Leo"],["Caída","Aries"],["Ritmo","Unos dos años y medio por signo. Retrógrado unos cuatro meses y medio cada año."],["En el tarot","El Mundo (XXI)"]]],
["urano","Urano","♅","El cambio repentino, la libertad y la originalidad.",

 [["Símbolo","Hay dos versiones: una H que recuerda a Herschel, su descubridor, y un círculo con una flecha hacia arriba."],["Rige","Acuario (astrología moderna)"],["Ritmo","84 años para recorrer el zodiaco. Retrógrado unos cinco meses al año."],["En el tarot","El Loco (0), según la correspondencia moderna con el elemento aire"]]],
